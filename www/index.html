<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOUL">
<title>SOUL</title>
<style>
:root{--accent:#2f6fed;--bg:#f7f7f8;--card:#ffffff;--txt:#111;--sub:#8a8a8e;--line:#ececee}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
/* 顶部导航 */
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg);position:relative;z-index:5}
.top-icon{border:none;background:none;font-size:20px;color:#333;cursor:pointer;padding:6px;line-height:1}
.top-actions{display:flex;gap:4px}
.top-actions .top-icon{color:#333}
/* 定位 / 语音 */
#locBar{display:none;align-items:center;gap:4px;padding:4px 14px 10px;font-size:12px;color:var(--accent);background:var(--bg)}
#locBar .locclear{color:#c9c9ce;font-size:14px;cursor:pointer;user-select:none;-webkit-user-select:none;padding:0 2px}
#locBtn.glowing{color:var(--accent)}
#micBtn.rec{background:#ffe9e9;border-radius:50%;animation:micpulse 1s infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(238,51,51,.5)}50%{box-shadow:0 0 0 6px rgba(238,51,51,0)}}
/* 主内容区 */
#main{flex:1 1 auto;overflow-y:auto;scroll-behavior:smooth}
/* 欢迎态 */
#welcome{padding:24px 16px 12px}
.hello{font-size:30px;font-weight:800;text-align:center;color:#111;margin:18px 0 22px;letter-spacing:-.5px}
.welcome-tabs{display:flex;gap:10px;justify-content:center;margin-bottom:26px}
.wtab{padding:7px 20px;border-radius:18px;font-size:15px;border:1px solid transparent;cursor:pointer;background:#ececee;color:#333}
.wtab.on{background:#fff;border-color:#d9d9dc;font-weight:600;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.rec-title{font-size:13px;color:var(--sub);margin:0 6px 10px}
.recs{display:flex;flex-direction:column;gap:10px}
.rec-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;font-size:15px;color:#222;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.rec-card:active{background:#f0f1f3}
.quick-row{display:flex;gap:8px;margin-top:22px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.qbtn{flex:0 0 auto;padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:#333;font-size:14px;cursor:pointer}
.qbtn:active{background:#f0f1f3}
/* 聊天区 */
#chat{display:none;padding:14px 12px}
.msg{display:flex;margin-bottom:12px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.msg .bubble{max-width:78%;padding:10px 12px;border-radius:18px;font-size:15px;line-height:1.55;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.ai .bubble{background:#fff;color:var(--txt);border:1px solid var(--line);border-bottom-left-radius:6px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;margin-right:8px;flex:0 0 auto}
.msg.user .avatar{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:10px}
.text{padding:4px 0}
.media{margin-top:6px}
.media img{max-width:100%;border-radius:12px;display:block}
.media video{max-width:100%;border-radius:12px;width:100%;background:#000}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 底部输入栏 */
#composer{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:8px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#preview{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 6px}
#preview .pthumb{position:relative}
#preview img{width:54px;height:54px;object-fit:cover;border-radius:10px}
#preview .del{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#0008;color:#fff;font-size:12px;line-height:18px;text-align:center;cursor:pointer}
#refbar{display:none;align-items:center;gap:8px;padding:4px 6px;margin-bottom:2px;font-size:12px;color:var(--accent)}
#refbar img{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
#refbar button{border:none;background:#eee;color:#666;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1;cursor:pointer}
.thumbs .th{position:relative;display:inline-block}
.thumbs .th .qref{position:absolute;right:2px;bottom:2px;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;cursor:pointer}
#row{display:flex;align-items:center;gap:6px;background:#f4f4f6;border-radius:24px;padding:4px 8px}
#row input[type=text]{flex:1;min-width:0;border:none;background:transparent;padding:8px 6px;font-size:15px;outline:none}
.icon-btn{border:none;background:none;font-size:20px;cursor:pointer;color:#333;flex:0 0 auto;padding:0;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.icon-btn.plus{font-size:24px}
.icon-btn.send{color:var(--accent);background:none;box-shadow:none;font-size:22px;font-weight:400;width:44px;height:44px;min-width:44px;min-height:44px;border-radius:0}
.icon-btn.send:active{opacity:.5}
/* 生成面板 */
#gen{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;padding:16px;box-shadow:0 -4px 20px rgba(0,0,0,.12);z-index:20}
#gen h3{margin-bottom:10px;font-size:16px}
#gen .seg{display:flex;gap:8px;margin-bottom:10px}
#gen .seg button{flex:1;padding:8px;border-radius:12px;border:1px solid #ddd;background:#f7f7f9;cursor:pointer;font-size:14px}
#gen .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#gen textarea{width:100%;border:1px solid #e2e2e2;border-radius:12px;padding:10px;font-size:15px;outline:none;resize:none;min-height:70px}
#gen .dur{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px}
#gen .dur span{background:var(--accent);color:#fff;padding:3px 10px;border-radius:8px}
#gen .video-opts{margin:8px 0;font-size:14px}
#gen .video-opts .st{border:1px solid #d9d9dc;border-radius:8px;background:#fff;padding:5px 14px;margin:0 5px 0 0;cursor:pointer}
#gen .video-opts .st.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#gen .video-opts .refbtn{background:#f5f5f7;border:1px solid #d9d9dc;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
#gen .video-opts #refThumbs{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
#gen .video-opts #refThumbs .rt{position:relative}
#gen .video-opts #refThumbs .rt img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid #d9d9dc;display:block}
#gen .video-opts #refThumbs .rt video,#gen .video-opts #clipThumbs .rt video{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid #d9d9dc;display:block;background:#000}
#gen .video-opts #refThumbs .rt button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:none;background:#f44336;color:#fff;font-size:12px;line-height:1;cursor:pointer}
#gen .btns{display:flex;gap:8px;margin-top:10px}
#gen .btns button{flex:1;padding:11px;border:none;border-radius:12px;font-size:15px;cursor:pointer;background:var(--accent);color:#fff}
#gen .btns button.gray{background:#eee;color:#333}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:50;display:none}
.progress{font-size:12px;color:var(--sub);margin-top:4px}
.editrow{margin-top:8px}
.edit-btn{border:none;background:var(--accent);color:#fff;padding:6px 12px;border-radius:14px;font-size:13px;cursor:pointer}
/* 媒体操作(保存/删除) */
.medac{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.medbtn{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:12px;background:#f5f5f7;color:#333;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
.medbtn.delb{color:#e33}
.medbtn.editb{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 顶部左侧 会话区 */
.topbar .left{display:flex;align-items:center;gap:2px}
#newBtn{display:none;align-items:center;padding:6px;color:var(--accent)}
/* 抽屉 */
#drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:320px;background:#fff;z-index:40;transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.15)}
#drawer.open{transform:translateX(0)}
#drawerMask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;display:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.drawer-title{font-size:17px;font-weight:700}
.drawer-head button{border:none;background:none;color:var(--accent);font-size:14px;cursor:pointer;padding:4px 8px}
#sessionList{flex:1;overflow-y:auto;padding:8px}
.sess-item{display:flex;align-items:center;gap:8px;padding:12px 10px;border-radius:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.sess-item:active{background:#f0f1f3}
.sess-item.on{background:#eef3ff}
.sess-title{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-item .pin{font-size:12px}
.sess-item .sum{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 4px}
.drawer-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.drawer-foot button{border:1px solid var(--line);background:#f5f5f7;border-radius:12px;padding:11px;font-size:14px;cursor:pointer}
.drawer-foot button.danger{color:#e33}
.empty-sess{color:var(--sub);font-size:13px;text-align:center;padding:30px 10px}
/* 会话长按菜单 */
#sessMenu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:80%;max-width:300px;background:#fff;border-radius:16px;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden;display:none}
.menu-row{padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer}
.menu-row:last-child{border-bottom:none}
.menu-row.del{color:#e33}
.menu-row b{font-size:13px;color:var(--sub)}
/* 登录 */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#2f6fed,#5b8cff);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#login .card{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
#login h2{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
#login p{text-align:center;color:var(--sub);font-size:13px;margin-bottom:18px}
#login input{width:100%;border:1px solid #e2e2e2;border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:12px;outline:none}
#login input:focus{border-color:var(--accent)}
#login button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;cursor:pointer}
#login .err{color:#e33;font-size:13px;text-align:center;margin-bottom:10px;min-height:16px}
</style>
</head>
<body>

<header class="topbar">
  <div class="left">
    <button class="top-icon" title="会话" onclick="openDrawer()">☰</button>
    <button class="top-icon" id="newBtn" title="新建对话" onclick="newSession()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
  </div>
</header>

<main id="main">
  <!-- 欢迎态 -->
  <section id="welcome">
    <h1 class="hello">有什么我能帮你的吗？</h1>
    <div class="welcome-tabs">
      <button class="wtab on" onclick="switchTab('chat',this)">对话</button>
      <button class="wtab" onclick="switchTab('work',this)">工作</button>
    </div>
    <div class="rec-title" id="recTitle">为你推荐</div>
    <div id="recs" class="recs"></div>
    <div id="quickRow" class="quick-row"></div>
  </section>

  <!-- 聊天区 -->
  <div id="chat"></div>
</main>

<!-- 底部输入栏 -->
<div id="composer">
  <div id="refbar"></div>
  <div id="preview"></div>
  <div id="row">
    <button class="icon-btn" title="拍照/添加图片" onclick="fileClick()">📷</button>
    <button class="icon-btn" id="micBtn" title="语音输入" onclick="startVoice()"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:block"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg></button>
    <input type="text" id="input" placeholder="发消息或按住说话..." onkeydown="if(event.key==='Enter')send()">
    <button id="send" class="icon-btn send" onclick="send()" title="发送">➤</button>
    <button class="icon-btn plus" title="生成" onclick="toggleGen()">＋</button>
  </div>
  <input type="file" id="file" accept="image/*" multiple style="display:none">
</div>

<div class="mask" id="mask" onclick="toggleGen()"></div>
<div id="gen">
  <h3>生成</h3>
  <div class="seg">
    <button id="segImg" class="on" onclick="setMode('image')">🖼 生图</button>
    <button id="segVid" onclick="setMode('video')">🎬 生视频</button>
  </div>
  <textarea id="prompt" placeholder="例如：一只在沙滩奔跑的红色机器人"></textarea>
  <div class="dur" id="durWrap" style="display:none">时长
    <button style="cursor:pointer;border:none;background:#eee;padding:2px 8px;border-radius:6px" onclick="dur(-1)">−</button>
    <span id="durVal">5</span> 秒
    <button style="cursor:pointer;border:none;background:#eee;padding:2px 8px;border-radius:6px" onclick="dur(1)">＋</button>
  </div>
  <div class="video-opts" id="vidOpts" style="display:none">
    <div style="margin-bottom:8px">步数
      <button class="st on" onclick="setSteps(16)">16步</button>
      <button class="st" onclick="setSteps(8)">8步</button>
      <button class="st" onclick="setSteps(32)">32步</button>
    </div>
    <div><button class="refbtn" onclick="refClick()">📷 参考图(可多张)</button><span id="refCount" style="margin-left:8px;color:#999;font-size:12px"></span></div>
    <div id="refThumbs"></div>
    <div id="refHint" style="display:none;margin-top:6px;padding:6px 8px;border-radius:6px;background:#fff4e6;color:#b26b00;font-size:12px;line-height:1.5"></div>
    <div style="margin-top:6px"><button class="refbtn" onclick="audioClick()">🎵 音频</button><span id="audioName" style="margin-left:8px;color:#999;font-size:12px"></span></div>
    <div style="margin-top:6px"><button class="refbtn" onclick="clipClick()">🎬 参考视频(可多)</button><span id="clipCount" style="margin-left:8px;color:#999;font-size:12px"></span></div>
    <div id="clipThumbs" style="display:flex;flex-wrap:wrap;gap:7px;margin-top:8px"></div>
    <input type="file" id="reffile" accept="image/*" multiple style="display:none">
    <input type="file" id="audiofile" accept="audio/*" style="display:none">
    <input type="file" id="clipfile" accept="video/*" multiple style="display:none">
  </div>
  <div class="btns"><button class="gray" onclick="toggleGen()">取消</button><button onclick="doGen()">开始</button></div>
</div>

<!-- 左侧抽屉 -->
<div id="drawerMask" onclick="closeDrawer()"></div>
<aside id="drawer">
  <div class="drawer-head">
    <span class="drawer-title">会话</span>
    <button onclick="newSession()">＋ 新对话</button>
  </div>
  <div id="sessionList"></div>
  <div class="drawer-foot">
    <button onclick="compressCurrent()">🧹 压缩当前上下文</button>
    <button class="danger" onclick="setToken()">🔑 退出登录</button>
  </div>
</aside>
<!-- 会话长按菜单 -->
<div id="sessMenu" onclick="closeSessMenu()"></div>

<style>
#viewer{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center}
#viewer.on{display:flex}
#vstage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#vstage img{max-width:100%;max-height:100%;display:block;transform-origin:center center;will-change:transform;transition:none}
#vstage video{max-width:100%;max-height:100%;display:none;background:#000}
.v-x{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 8px);z-index:10002;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.v-zoom{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10001;display:none;align-items:center;gap:12px;color:#fff;background:rgba(255,255,255,.14);padding:6px 14px;border-radius:22px}
.v-zoom.on{display:flex}
.v-zoom button{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer}
.media img{cursor:zoom-in}
/* 涂抹擦除 overlay */
.medbtn.erasb{background:#fff;color:#e33;border-color:#f0b4b4}
#eraseOv{display:none;position:fixed;inset:0;background:#111;z-index:72;flex-direction:column}
#eraseOv.on{display:flex}
.er-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;color:#fff}
.er-head b{font-size:15px}
.er-head .er-close{border:none;background:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}
#erStage{flex:1 1 auto;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
#erStage img{max-width:100%;max-height:100%;display:block}
#erShow{position:absolute;pointer-events:none}
.er-tip{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:6px 14px;border-radius:18px;white-space:nowrap;z-index:3}
.er-bar{flex:0 0 auto;display:flex;gap:10px;padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:#1b1b1f}
.er-bar button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;cursor:pointer}
.er-bar .undo,.er-bar .cls{background:#333;color:#fff}
.er-bar .done{background:var(--accent);color:#fff}
</style>
<!-- 媒体查看器 (点击放大) -->
<div id="viewer" onclick="vzClose()">
  <div id="vstage" onclick="event.stopPropagation()">
    <img id="vimg" alt="">
    <video id="vvid" controls onclick="event.stopPropagation()"></video>
  </div>
  <button class="v-x" onclick="vzClose()">✕</button>
  <div class="v-zoom" id="vzoom" onclick="event.stopPropagation()">
    <button onclick="vzAdj(-1)">−</button>
    <span id="vzoomv">适配</span>
    <button onclick="vzAdj(1)">＋</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 涂抹擦除 overlay -->
<div id="eraseOv">
  <div class="er-head"><b>🧹 涂抹要擦除的物体</b><button class="er-close" onclick="eraseCancel()">✕</button></div>
  <div id="erStage">
    <img id="erImg" alt="">
    <canvas id="erShow"></canvas>
    <canvas id="erMask" style="display:none"></canvas>
    <div class="er-tip" id="erTip">用手指涂抹要擦掉的区域（半透明标记）</div>

let userLoc=null;   // {label,lat,lng,...} 持久化到 localStorage

async function askIpLoc(){

    const r=await apiFetch(API+'/api/location',{headers:authHeaders()}); const j=await r.json();
    if(j&&j.ok){ userLoc=j; saveLoc(); return userLoc; }
  }catch(e){}
  return null;

async function locateMe(useGeo, lat, lng){
  // 1) 传了坐标 -> 逆地理 (photon)
  if(!isNaN(lat) && !isNaN(lng)){
    try{
      const r=await apiFetch(API+'/api/location?lat='+lat+'&lng='+lng,{headers:authHeaders()}); const j=await r.json();
      if(j&&j.ok){ userLoc=j; saveLoc(); return userLoc; }
    }catch(e){}
  }
  // 2) 浏览器自动定位 (需 HTTPS; 当前 HTTP 会失败 -> 自动回退 IP 概略)
  if(!window.Capacitor && useGeo!==false && navigator.geolocation){
    const pos = await new Promise(res=>{
      navigator.geolocation.getCurrentPosition(
        p=>res({ok:true, lat:p.coords.latitude, lng:p.coords.longitude}),
        e=>res({ok:false}),
        {enableHighAccuracy:false, timeout:6000, maximumAge:600000}
      );
    });
    if(pos && pos.ok) return await locateMe(false, pos.lat, pos.lng);
  }
  // 3) IP 概略 (服务器出口)
  return await askIpLoc();
}

function needLocation(msg){

}

function speak(text){ if(!speakOn || !text || !window.speechSynthesis) return; try{ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text).replace(/[\n\s]+/g,' ')); u.lang='zh-CN'; window.speechSynthesis.speak(u); }catch(e){} }
function setMic(on){ const b=$('micBtn'); if(b) b.classList.toggle('rec', !!on); }
function startVoice(){
  // 优先：App 内 Capacitor 原生语音识别插件
  const CP = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition;
  if(CP){ startNativeVoice(CP); return; }
  // 兜底：浏览器(如 Safari) Web Speech API
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('当前浏览器不支持语音输入'); return; }
  if(!window.isSecureContext){
    toast('当前为 HTTP，浏览器禁用语音识别。请用 https 地址访问（如公网域名）'); return;
  }
  if(recognizing){ if(SRrec) try{SRrec.stop()}catch(e){}; SRrec=null; recognizing=false; setMic(false); return; }
  const rec = new SR();
  SRrec = rec; rec.lang='zh-CN'; rec.interimResults=false; rec.continuous=false;
  recognizing=true; setMic(true);
  rec.onresult = (e)=>{ const t=(e.results && e.results[0] && e.results[0][0] && e.results[0][0].transcript)||''; if(t){ $('input').value=t; send(); } };
  rec.onerror = (e)=>{
    recognizing=false; setMic(false); SRrec=null;
    const err=e.error||'';
    const zhong = (err==='not-allowed'||err==='service-not-allowed') ? '浏览器禁止语音识别：请允许麦克风权限，或用 https 访问'
      : (err==='no-speech'||err==='audio-capture') ? '没听清，请对准麦克风再说一遍'
      : ('语音识别失败：'+err);
    toast(zhong);
  };
  rec.onend   = ()=>{ recognizing=false; setMic(false); };
  try{ rec.start(); }catch(e){ toast('语音识别启动失败'); recognizing=false; setMic(false); }
}
// App 内原生语音识别（@capacitor-community/speech-recognition）
let _partialH = null;
function removePartial(){ if(_partialH){ try{_partialH.remove()}catch(e){} _partialH=null; } }
async function startNativeVoice(CP){
  if(recognizing){
    // 再次点击 = 结束并发送当前已识别文字
    try{ await CP.stop(); }catch(e){}
    recognizing=false; setMic(false); removePartial();
    const t=$('input').value.trim();
    if(t) send();
    return;
  }
  try{
    let av; try{ av = await CP.available(); }catch(e){}
    if(av && av.available===false){ toast('本机不支持语音识别'); return; }
    let perm; try{ perm = await CP.requestPermissions(); }catch(e){}
    const st = perm && (perm.speechRecognition || perm.mic || perm.microphone);
    if(st==='denied'){ toast('麦克风/语音权限未授权，请到手机设置允许'); return; }
    recognizing=true; setMic(true);
    try{ removePartial(); _partialH = await CP.addListener('partialResults', (d)=>{ const t=(d && d.matches && d.matches[0])||''; if(t){ $('input').value=t; } }); }catch(e){}
    // 优先：partial 实时模式（start 立即返回，说完了再点一下结束）
    try{
      await CP.start({ language:'zh-CN', maxResults:1, partialResults:true });
      toast('说话中…说完再点一下麦克风结束');
    }catch(e1){
      // 回退：无 partial 的最终结果模式（部分 iOS 版本不支持 partial 会抛错）
      let res;
      try{ res = await CP.start({ language:'zh-CN', maxResults:1, partialResults:false }); }
      catch(e2){ recognizing=false; setMic(false); removePartial(); toast('语音识别失败：'+((e2&&(e2.message||e2))||'未知错误')); return; }
      recognizing=false; setMic(false); removePartial();
      const t=(res && res.matches && res.matches[0])||'';
      if(t){ $('input').value=t; send(); } else toast('未识别到语音，请重试');
    }
  }catch(e){
    recognizing=false; setMic(false); removePartial();
    toast('语音识别失败：'+((e && (e.message||e))||'未知错误'));
  }
}

function mediaHtml(med){

  const arr=med.map(m=>({type:m.type,url:m.url}));
  const inner=med.map((m,i)=> m.type==='video'
     ? `<video controls src="${esc(mSrc(m.url))}"></video>`
     : `<img src="${esc(mSrc(m.url))}" data-i="${i}" onclick="vzOpen(this)" loading="lazy">`).join('');
  return `<div class="media" data-media="${esc(JSON.stringify(arr))}">${inner}</div>`;

let vType='image',vList=[],vCur=0,vFit=true;
function vzOpen(el){
  const box=el.closest('.media'); if(!box)return;
  let arr=[]; try{ arr=JSON.parse(box.getAttribute('data-media')||'[]'); }catch(e){}
  viewMedia(arr, parseInt(el.dataset.i,10)||0);
}
function viewMedia(arr,idx){
  vList=arr||[]; vCur=idx||0; if(!vList.length)return;
  vType=vList[vCur].type||'image';
  const v=$('viewer'),im=$('vimg'),vd=$('vvid');
  v.classList.add('on');

  else { vd.style.display='block'; im.style.display='none'; vd.src=mSrc(vList[vCur].url); vd.play(); }
  $('vzoom').classList.toggle('on', vType==='image');
}

let vScale=1,vTx=0,vTy=0;
function vApply(){ const im=$('vimg'); if(im) im.style.transform='translate('+vTx+'px,'+vTy+'px) scale('+vScale+')'; const z=$('vzoomv'); if(z) z.textContent=Math.round(vScale*100)+'%'; }
function vzFit(){ vScale=1; vTx=0; vTy=0; vApply(); }
function vzTap(){ vScale=(vScale>1?1:2); if(vScale<=1){vTx=0;vTy=0;} vApply(); }
function vzAdj(d){ vScale=Math.min(3,Math.max(1,Math.round((vScale+d*0.5)*10)/10)); if(vScale<=1){vTx=0;vTy=0;} vApply(); }
(function(){ const stage=$('vstage'); if(!stage) return; let sd=0,ss=1,ps=null;
  stage.addEventListener('touchstart',function(e){
    if(e.touches.length===2){ const a=e.touches[0],b=e.touches[1]; sd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1; ss=vScale; e.preventDefault(); }
    else if(e.touches.length===1 && vScale>1){ ps={x:e.touches[0].clientX,y:e.touches[0].clientY,tx:vTx,ty:vTy}; }
  },{passive:false});
  stage.addEventListener('touchmove',function(e){
    if(e.touches.length===2){ const a=e.touches[0],b=e.touches[1]; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1; vScale=Math.min(3,Math.max(1,ss*(d/sd))); if(vScale<=1){vTx=0;vTy=0;} vApply(); e.preventDefault(); }
    else if(e.touches.length===1 && ps){ vTx=ps.tx+(e.touches[0].clientX-ps.x); vTy=ps.ty+(e.touches[0].clientY-ps.y); vApply(); e.preventDefault(); }
  },{passive:false});
  stage.addEventListener('touchend',function(e){ if(e.touches.length<2) sd=0; if(e.touches.length===0) ps=null; });
})();

// ---------- 上下文压缩 ----------
async function compressContext(s, silent){
  s=s||curSession(); if(!s) return;
  const msgs=s.messages.filter(m=>!m.loading&&m.text).map(m=>({role:m.role,content:m.text}));
  if(!msgs.length){ if(!silent) toast('当前没有可压缩的内容'); return; }
  if(msgs.length<12 && !silent){ toast('对话还不长，暂无需压缩'); return; }
  if(!silent) toast('正在压缩上下文…');
  try{
    const r=await apiFetch(API+'/api/summarize',{method:'POST',headers:authHeaders(),body:JSON.stringify({messages:msgs.slice(0,60)})});
    const j=await r.json();
    if(j.ok&&j.summary){ s.summary=j.summary; saveSess(); if(!silent) toast('已压缩上下文(旧内容转为摘要)'); renderSessionList(); }
    else throw new Error(j.error?j.error.message:'压缩失败');
  }catch(e){ if(!silent) toast('压缩失败：'+(e.message||'')); }
}
function compressCurrent(){ compressContext(curSession(), false); }

// ---------- 对话 ----------
async function send(){
  const txt=$('input').value.trim();
  if(sending)return;
  if(!txt&&pendingImages.length===0&&!refImg)return;
  showChat();
  const imgs=pendingImages.slice();
  const msgImgs=imgs.slice(); const msgMedia=[];
  if(refImg){ if(/^https?:/.test(refImg)) msgMedia.push({type:'image',url:refImg}); else msgImgs.push(refImg); }
  commitMsg('user', txt, msgImgs, msgMedia);   // 引用的图也显示在消息里, 像上传图一样
  $('input').value='';pendingImages=[];renderPreview();
  sending=true;$('send')&&($('send').disabled=true);
  const lm=loadingMsg();
  let histArr=buildHist().slice(0,-1);   // 去掉刚写入的当前用户消息, 避免上下文重复
  const hasNewImgs=imgs.length>0;
  // 本地认知：判断是否新话题，决定带多少历史（长期记忆仍由压缩摘要兜底）
  try{
    let isNew=false;
    if(hasNewImgs){
      isNew=true;   // 新上传图片=新视觉查询，不拖旧文字话题（图自带上下文，摘要兜底长期记忆）
    }else if(window.cog&&window.cog.isReady()&&txt&&txt.length>4&&histArr.length){
      const prev=histArr.slice(-2).map(h=>h.content);   // 只比最近2条，避免卡顿
      const r=await Promise.race([
        window.cog.simHist(txt,prev),
        new Promise(res=>setTimeout(()=>res({best:1,bestIdx:-1,timeout:true}),400))   // 400ms 算不完就直接发
      ]);
      isNew=r.best<0.38;
      console.log('[cog] sim',r.timeout?'timeout':r.best.toFixed(3),isNew?'新话题-只带最近一轮':'延续-正常窗口');
    }
    if(isNew) histArr=histArr.slice(-2);
  }catch(e){}
  const body={message:txt, history:histArr};
  // 按需自动定位: 仅当消息与位置相关(查天气/附近等)才定位并带上, 其余不定位
  if(needLocation(txt)){
    const loc = userLoc || await locateMe();
    if(loc) body.location = loc;
  }
  const s=curSession(); if(s && s.summary) body._compressContext=s.summary;
  let chatImgs = imgs.map(b=>({data:b,mime:'image/jpeg'}));
  if(refImg){ chatImgs.unshift(/^https?:/.test(refImg)?{url:refImg}:{data:refImg,mime:'image/jpeg'}); }  // 引用的图片作为改图对象
  if(chatImgs.length===0 && lastImageUrl){ chatImgs=[{url:lastImageUrl}]; }   // 没传新图时带上上张图做上下文
  if(chatImgs.length)body.images=chatImgs;
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),90000);
  try{
    const r=await apiFetch(API+'/api/chat',{method:'POST',headers:authHeaders(),body:JSON.stringify(body),signal:ac.signal});
    const j=await r.json();
    let media=[];if(j.media&&j.media.length)media=j.media;
    const prefix=j.searched?'<div style="font-size:12px;color:var(--accent);margin-bottom:6px">🌐 已联网搜索</div>':'';
    fillMsg(lm.m, lm.el, {text:j.reply||'', display:j.reply||'', media, prefix});
    if(media.length){ const _im=media.find(x=>x.type==='image'); if(_im&&_im.url) lastImageUrl=_im.url; }   // chat出图也更新最近图, 便于接着改
    speak(j.reply||'');
    clearRef();
    const ss=curSession();
    if(ss && ss.messages.filter(m=>!m.loading&&m.text).length>24) compressContext(ss,true);
  }catch(e){ failMsg(lm, ac.signal.aborted?'响应太慢（可能联网搜索中），请稍后重试':e.message); }
  finally{clearTimeout(to)}
  sending=false;if($('send'))$('send').disabled=false;scrollBottom();
}

async function shrinkImage(dataUrl,maxDim,q){return new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const m=Math.max(w,h);if(m>maxDim){const s=maxDim/m;w=w*s;h=h*s;}w=Math.max(64,Math.min(maxDim,Math.floor(w/64)*64));h=Math.max(64,Math.min(maxDim,Math.floor(h/64)*64));try{const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',q).split(',')[1]);}catch(err){res(dataUrl.split(',')[1]);}};img.onerror=()=>res(dataUrl.split(',')[1]);img.src=dataUrl;});}

function updateRefHint(){
  const el=$('refHint'); if(!el) return;

  const ars=refAr.filter(a=>a);
  const hasPortrait=ars.some(a=>a<1.0);
  const hasLandscape=ars.some(a=>a>1.0);
  const mix=hasPortrait&&hasLandscape;
  let msg='';
  if(n>0&&n<=2){
    msg='⚠️ 只传 1-2 张图会走首尾帧插值(fl2va)';
    if(mix) msg+='，你混了竖屏+横屏，竖屏会被硬压成横屏变形';
    msg+='。要避免变形、把人物自然放进场景，建议：加满 3 张图，或上传音频/参考视频走 ref2va 合成。';
  } else if(n>=3){
    msg='✅ 多参考(ref2va)合成，比例更稳';
    if(mix) msg+='，不过竖屏+横屏混用构图可能不理想，建议统一比例';

// ---------- 涂抹擦除 (mask + remove LoRA, 按接入指南 7.1) ----------
// 移除类：用户涂抹标记要擦掉的物体 -> 生成 mask(白=涂) -> /api/edit 带 use_lora:'remove' + edit_strength:1.0，
// mask 外用原图像素直接贴回，所以"只擦目标、其余完全不变"。与"改图"(指令式微调)分开两条链路。
let erUrl='', erStrokes=[], erDrawing=false, erLast=null;
function erasePrompt(url){
  erUrl=url; erStrokes=[];
  const ov=$('eraseOv'); ov.classList.add('on');
  const img=$('erImg'); img.src=mSrc(url);
  img.onload=()=>{ erLayout(); erRedraw(); };
}
function erLayout(){
  const img=$('erImg'), show=$('erShow'), maskc=$('erMask'), stage=$('erStage');
  const ir=img.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  const w=Math.max(1,Math.round(ir.width)), h=Math.max(1,Math.round(ir.height));
  show.width=w; show.height=h; maskc.width=w; maskc.height=h;
  show.style.left=(ir.left-sr.left)+'px'; show.style.top=(ir.top-sr.top)+'px';
}
function erPos(e){
  const c=$('erShow').getBoundingClientRect();
  const cx=(e.touches&&e.touches[0])?e.touches[0].clientX:(e.clientX||0);
  const cy=(e.touches&&e.touches[0])?e.touches[0].clientY:(e.clientY||0);
  return {x:cx-c.left, y:cy-c.top};
}
function erDown(e){ if(!erUrl)return; e.preventDefault(); erDrawing=true; erLast=null; erBegin(erPos(e)); }
function erMove(e){ if(!erDrawing)return; e.preventDefault(); var pt=erPos(e); if(erLast) erLast.push(pt); erRedraw(); }
function erUp(){ erDrawing=false; erLast=null; }
function erBegin(pt){ erStrokes.push([pt]); erLast=erStrokes[erStrokes.length-1]; erRedraw(); }
function erRedraw(){
  const show=$('erShow'), maskc=$('erMask');
  if(!show.width||!show.height) return;
  const sctx=show.getContext('2d'), mctx=maskc.getContext('2d');
  sctx.clearRect(0,0,show.width,show.height); mctx.clearRect(0,0,maskc.width,maskc.height);
  const lw=Math.max(20, Math.round(show.width*0.05));  // 笔刷按图宽自适应
  sctx.lineCap='round'; sctx.lineJoin='round'; sctx.lineWidth=lw; sctx.strokeStyle='rgba(255,60,60,0.5)';
  mctx.lineCap='round'; mctx.lineJoin='round'; mctx.lineWidth=lw; mctx.strokeStyle='#fff';
  erStrokes.forEach(st=>{ if(!st.length)return; sctx.beginPath(); mctx.beginPath();
    st.forEach((p,i)=>{ if(i===0){ sctx.moveTo(p.x,p.y); mctx.moveTo(p.x,p.y);} else { sctx.lineTo(p.x,p.y); mctx.lineTo(p.x,p.y);} });
    sctx.stroke(); mctx.stroke(); });
}
function erUndo(){ erStrokes.pop(); erRedraw(); }
function erClear(){ erStrokes=[]; erRedraw(); }
function eraseCancel(){ const ov=$('eraseOv'); ov.classList.remove('on'); erStrokes=[]; erDrawing=false; }
function eraseFinish(){
  const maskc=$('erMask');
  const px=maskc.getContext('2d').getImageData(0,0,maskc.width,maskc.height).data;
  let any=false; for(var i=3;i<px.length;i+=4){ if(px[i]>40){ any=true; break; } }
  if(!any){ toast('请先涂抹要擦除的区域'); return; }
  const maskB64=maskc.toDataURL('image/png').split(',')[1];
  const p=prompt('要擦掉涂抹区域里的什么？例如：耳机 / 水印 / 背景里的人');
  const obj=(p||'').trim();
  if(!obj){ eraseCancel(); return; }
  const url=erUrl; eraseCancel();
  eraseImage(url, obj, maskB64);
}
async function eraseImage(imgUrl,obj,maskB64){
  const lm=loadingMsg('');
  try{
    const r=await apiFetch(API+'/api/edit',{method:'POST',headers:authHeaders(),body:JSON.stringify({prompt:'去掉'+obj,image_url:imgUrl,mask_base64:maskB64,use_lora:'remove',edit_strength:1.0})});
    const j=await r.json();if(!j.ok||!j.image_url)throw new Error(j.error?j.error.message:'擦除失败');
    lastImageUrl=j.image_url;
    fillMsg(lm.m, lm.el, {display:'已擦除', media:[{type:'image',url:j.image_url}]});
  }catch(e){ failMsg(lm, e.message); }
  scrollBottom();
}
// 涂抹事件绑定
(function(){ const st=$('erStage'); if(!st)return;
  st.addEventListener('touchstart',erDown,{passive:false});
  st.addEventListener('touchmove',erMove,{passive:false});
  st.addEventListener('touchend',erUp);
  st.addEventListener('mousedown',erDown);
  st.addEventListener('mousemove',erMove);
  st.addEventListener('mouseup',erUp);
  st.addEventListener('mouseleave',erUp);
})();

// ---------- 联网搜索 (Tavily, 快) ----------
async function doSearch(){
  const q=prompt('要联网搜索什么？例如：今天佛山天气 / 黄金价格');
  if(!q||!q.trim())return;
  showChat();
  const lm=loadingMsg('搜索中…');
  try{
    const r=await apiFetch(API+'/api/search',{method:'POST',headers:authHeaders(),body:JSON.stringify({query:q.trim()})});
    const j=await r.json();if(!j.ok)throw new Error(j.error?j.error.message:'搜索失败');
    const parts=[];
    const txt=(j.answer||'').trim()||'（未找到相关内容）';
    parts.push('<div class="text">'+esc(txt).replace(/\n/g,'<br>')+'</div>');
    if(Array.isArray(j.sources)&&j.sources.length){
      parts.push('<div class="text" style="margin-top:10px;opacity:.65;font-size:12px;line-height:1.7">来源：<br>'+j.sources.map(s=>'• '+esc(s)).join('<br>')+'</div>');
    }
    lm.m.text=txt; lm.m.display=txt; lm.m.loading=false;
    lm.el.querySelector('.bubble').innerHTML=parts.join('');
    const ss=curSession(); if(ss){ autoTitle(ss); saveSess(); }
  }catch(e){ lm.el.querySelector('.bubble').innerHTML='<div class="text">⚠️ '+esc(e.message)+'</div>'; const ss=curSession(); if(ss) saveSess(); }
  scrollBottom();
}

// 启动
function initApp(){
  sessions=loadSessions();
  loadLoc();                       // 仅读缓存, 不显示; 定位改为按需触发
  if(sessions.length && sessions[0].messages.length){ curId=sessions[0].id; showSession(curId); }
  else { showWel(); }
}
// 左侧边缘向右滑打开抽屉
(function(){
  let tx=0,ty=0;
  document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchmove',e=>{
    const dx=e.touches[0].clientX-tx, dy=e.touches[0].clientY-ty;
    if(tx<26 && dx>70 && Math.abs(dy)<70 && !$('drawer').classList.contains('open')){ openDrawer(); }
  },{passive:true});
})();
document.getElementById('reffile').addEventListener('change',e=>{addRefFiles(e.target.files);e.target.value=''});
document.getElementById('audiofile').addEventListener('change',e=>{if(e.target.files[0])addAudioFile(e.target.files[0]);e.target.value=''});
document.getElementById('clipfile').addEventListener('change',e=>{addClipFiles(e.target.files);e.target.value=''});
if(sessionToken){hideLogin();initApp()}else{showLogin()}
