<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOUL">
<title>SOUL</title>
<style>
:root{--accent:#2f6fed;--bg:#f7f7f8;--card:#ffffff;--txt:#111;--sub:#8a8a8e;--line:#ececee}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
/* 顶部导航 */
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg);position:relative;z-index:5}
.top-icon{border:none;background:none;font-size:20px;color:#333;cursor:pointer;padding:6px;line-height:1}
.top-actions{display:flex;gap:4px}
.top-actions .top-icon{color:#333}
/* 定位 / 语音 */
#locBar{display:none;align-items:center;gap:4px;padding:4px 14px 10px;font-size:12px;color:var(--accent);background:var(--bg)}
#locBar .locclear{color:#c9c9ce;font-size:14px;cursor:pointer;user-select:none;-webkit-user-select:none;padding:0 2px}
#locBtn.glowing{color:var(--accent)}
#micBtn.rec{background:#ffe9e9;border-radius:50%;animation:micpulse 1s infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(238,51,51,.5)}50%{box-shadow:0 0 0 6px rgba(238,51,51,0)}}
/* 主内容区 */
#main{flex:1 1 auto;overflow-y:auto;scroll-behavior:smooth}
.sb-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,0,0,.06);background:rgba(118,118,128,.22);color:var(--sub);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:20;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.sb-fab:active{transform:translateX(-50%) scale(.92)}
.sb-fab svg{display:block}
/* 欢迎态 */
#welcome{padding:24px 16px 12px}
.hello{font-size:30px;font-weight:800;text-align:center;color:#111;margin:18px 0 22px;letter-spacing:-.5px}
.welcome-tabs{display:flex;gap:10px;justify-content:center;margin-bottom:26px}
.wtab{padding:7px 20px;border-radius:18px;font-size:15px;border:1px solid transparent;cursor:pointer;background:#ececee;color:#333}
.wtab.on{background:#fff;border-color:#d9d9dc;font-weight:600;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.rec-title{font-size:13px;color:var(--sub);margin:0 6px 10px}
.recs{display:flex;flex-direction:column;gap:10px}
.rec-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;font-size:15px;color:#222;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.rec-card:active{background:#f0f1f3}
.quick-row{display:flex;gap:8px;margin-top:22px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.qbtn{flex:0 0 auto;padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:#333;font-size:14px;cursor:pointer}
.qbtn:active{background:#f0f1f3}
/* 聊天区 */
#chat{display:none;padding:14px 12px}
.msg{display:flex;margin-bottom:12px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.msg .bubble{max-width:78%;padding:10px 12px;border-radius:18px;font-size:15px;line-height:1.55;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.ai .bubble{background:#fff;color:var(--txt);border:1px solid var(--line);border-bottom-left-radius:6px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;margin-right:8px;flex:0 0 auto}
.msg.user .avatar{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:10px}
.text{padding:2px 0}
.text .p{margin:.3em 0}
.text h1,.text h2,.text h3,.text h4,.text h5,.text h6{margin:.45em 0 .28em;font-weight:800;line-height:1.3}
.text h1{font-size:20px}.text h2{font-size:18px}.text h3{font-size:16px}.text h4,.text h5,.text h6{font-size:15px}
.text ul,.text ol{margin:.28em 0;padding-left:1.4em}
.text li{margin:.07em 0}
.text code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 4px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.text pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;overflow-x:auto;margin:.35em 0}
.text pre code{background:none;border:none;padding:0;font-size:13px;line-height:1.5}
.text blockquote{margin:.35em 0;padding:4px 10px;border-left:3px solid var(--accent);color:var(--sub)}
.text b,.text strong{font-weight:700}
.text a{color:var(--accent);text-decoration:underline;word-break:break-all}
.media{margin-top:6px}
.media img{max-width:100%;border-radius:12px;display:block}
.media video{max-width:100%;border-radius:12px;width:100%;background:#000}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 底部输入栏 */
#composer{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:8px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#preview{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 6px}
#preview .pthumb{position:relative}
#preview img{width:54px;height:54px;object-fit:cover;border-radius:10px}
#preview .del{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#0008;color:#fff;font-size:12px;line-height:18px;text-align:center;cursor:pointer}
#refbar{display:none;align-items:center;gap:8px;padding:4px 6px;margin-bottom:2px;font-size:12px;color:var(--accent)}
#refbar img{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
#refbar button{border:none;background:#eee;color:#666;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1;cursor:pointer}
.thumbs .th{position:relative;display:inline-block}
.thumbs .th .qref{position:absolute;right:2px;bottom:2px;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;cursor:pointer}
#row{display:flex;align-items:center;gap:6px;background:#f4f4f6;border-radius:24px;padding:4px 8px}
#row input[type=text]{flex:1;min-width:0;border:none;background:transparent;padding:8px 6px;font-size:15px;outline:none}
.icon-btn{border:none;background:none;font-size:20px;cursor:pointer;color:#333;flex:0 0 auto;padding:0;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.icon-btn.plus{font-size:24px}
.icon-btn.send{color:var(--accent);background:none;box-shadow:none;font-size:22px;font-weight:400;width:44px;height:44px;min-width:44px;min-height:44px;border-radius:0}
.icon-btn.send:active{opacity:.5}
/* 生成面板 */
#gen{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;padding:16px;box-shadow:0 -4px 20px rgba(0,0,0,.12);z-index:20}
#gen h3{margin-bottom:10px;font-size:16px}
#gen .seg{display:flex;gap:8px;margin-bottom:10px}
#gen .seg button{flex:1;padding:8px;border-radius:12px;border:1px solid #ddd;background:#f7f7f9;cursor:pointer;font-size:14px}
#gen .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#gen textarea{width:100%;border:1px solid #e2e2e2;border-radius:12px;padding:10px;font-size:15px;outline:none;resize:none;min-height:70px}
#gen .dur{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px}
#gen .dur span{background:var(--accent);color:#fff;padding:3px 10px;border-radius:8px}
#gen .video-opts{margin:8px 0;font-size:14px}
#gen .video-opts .st{border:1px solid #d9d9dc;border-radius:8px;background:#fff;padding:5px 14px;margin:0 5px 0 0;cursor:pointer}
#gen .video-opts .st.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#gen .rtb{display:inline-block;border:1px solid #d9d9dc;border-radius:8px;background:#fff;padding:5px 14px;margin:0 5px 0 0;cursor:pointer;font-size:14px}
#gen .rtb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#gen .video-opts .refbtn{background:#f5f5f7;border:1px solid #d9d9dc;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
#gen .video-opts #refThumbs{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
#gen .video-opts #refThumbs .rt{position:relative}
#gen .video-opts #refThumbs .rt img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid #d9d9dc;display:block}
#gen .video-opts #refThumbs .rt video,#gen .video-opts #clipThumbs .rt video{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid #d9d9dc;display:block;background:#000}
#gen .video-opts #refThumbs .rt button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:none;background:#f44336;color:#fff;font-size:12px;line-height:1;cursor:pointer}
#gen .btns{display:flex;gap:8px;margin-top:10px}
#gen .btns button{flex:1;padding:11px;border:none;border-radius:12px;font-size:15px;cursor:pointer;background:var(--accent);color:#fff}
#gen .btns button.gray{background:#eee;color:#333}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:50;display:none}
#healthBar{display:none;align-items:center;gap:6px;padding:8px 14px;background:#fff3e0;color:#7a4f00;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line)}
html.dark #healthBar{background:#3a2e12;color:#ffd591}
#diag{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;z-index:12;max-height:82dvh;flex-direction:column;box-sizing:border-box;padding:16px 16px calc(env(safe-area-inset-bottom)+12px)}
#diag h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;justify-content:space-between}
#diag .close{border:none;background:none;color:var(--accent);font-size:15px;cursor:pointer;padding:2px 8px}
#diagBody{flex:1;overflow:auto;font-size:12px;color:var(--txt)}
#diagBody .row{margin:8px 0;font-size:12px}
#diagBody pre{margin:4px 0;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:11px}
#diag .foot{margin-top:10px;display:flex;gap:8px}
#diag .foot button{flex:1;padding:11px;border:none;border-radius:12px;font-size:14px;cursor:pointer;background:var(--accent);color:#fff}
.progress{font-size:12px;color:var(--sub);margin-top:4px}
.editrow{margin-top:8px}
.edit-btn{border:none;background:var(--accent);color:#fff;padding:6px 12px;border-radius:14px;font-size:13px;cursor:pointer}
/* 媒体操作(保存/删除) */
.medac{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.medi-item{margin-bottom:8px}
.medi-item:last-child{margin-bottom:0}
.medi-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.medi-broken{text-align:center;padding:10px 0;border:1px dashed var(--line);border-radius:12px;margin-bottom:6px}
.medbtn{font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:12px;background:#f5f5f7;color:#333;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3;white-space:nowrap}
.medbtn.delb{color:#e33}
.medbtn.editb{background:var(--accent);color:#fff;border-color:var(--accent)}
.retry-row{margin-top:10px;text-align:center}
.retryb{background:var(--accent);color:#fff;border-color:var(--accent);font-size:13px;padding:7px 16px;border-radius:14px}
.retryb:active{opacity:.8}
/* 顶部左侧 会话区 */
.topbar .left{display:flex;align-items:center;gap:2px}
#newBtn{display:none;align-items:center;padding:6px;color:var(--accent)}
/* 抽屉 */
#drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:320px;background:#fff;z-index:40;transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.15)}
#drawer.open{transform:translateX(0)}
#drawerMask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;display:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.drawer-title{font-size:17px;font-weight:700}
.drawer-head button{border:none;background:none;color:var(--accent);font-size:14px;cursor:pointer;padding:4px 8px}
#sessionList{flex:1;overflow-y:auto;padding:8px}
.sess-item{display:flex;align-items:center;gap:8px;padding:12px 10px;border-radius:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.sess-item:active{background:#f0f1f3}
.sess-item.on{background:#eef3ff}
.sess-title{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-item .pin{font-size:12px}
.sess-item .sum{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 4px}
.drawer-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.drawer-foot button{border:1px solid var(--line);background:#f5f5f7;border-radius:12px;padding:11px;font-size:14px;cursor:pointer}
.drawer-foot button.danger{color:#e33}
.empty-sess{color:var(--sub);font-size:13px;text-align:center;padding:30px 10px}
/* 会话长按菜单 */
#sessMenu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:80%;max-width:300px;background:#fff;border-radius:16px;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden;display:none}
.menu-row{padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer}
.menu-row:last-child{border-bottom:none}
.menu-row.del{color:#e33}
.menu-row b{font-size:13px;color:var(--sub)}
/* 登录 */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#2f6fed,#5b8cff);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#login .card{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
#login h2{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
#login p{text-align:center;color:var(--sub);font-size:13px;margin-bottom:18px}
#login input{width:100%;border:1px solid #e2e2e2;border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:12px;outline:none}
#login input:focus{border-color:var(--accent)}
#login button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;cursor:pointer}
#login .err{color:#e33;font-size:13px;text-align:center;margin-bottom:10px;min-height:16px}
/* ---------- 暗黑主题 ---------- */
html.dark{--bg:#0d0d0f;--card:#1c1c1e;--txt:#f2f2f7;--sub:#8e8e93;--line:#2c2c2e}
html.dark .top-icon,html.dark .top-actions .top-icon{color:#e5e5ea}
html.dark .hello{color:#f2f2f7}
html.dark .wtab{background:#2c2c2e;color:#e5e5ea}
html.dark .wtab.on{background:#1c1c1e;border-color:#3a3a3c;color:#f2f2f7}
html.dark .rec-card{color:#e5e5ea}
html.dark .rec-card:active,html.dark .qbtn:active,html.dark .sess-item:active{background:#2c2c2e}
html.dark .qbtn{color:#e5e5ea}
html.dark .msg.ai .bubble{background:#1c1c1e}
html.dark #composer{background:#1c1c1e}
html.dark #refbar button{background:#2c2c2e;color:#8e8e93}
html.dark #row{background:#2c2c2e}
html.dark #row input[type=text]{color:#f2f2f7}
html.dark #row input::placeholder,html.dark #gen textarea::placeholder,html.dark #login input::placeholder{color:#6d6d72}
html.dark .icon-btn{color:#e5e5ea}
html.dark #gen{background:#1c1c1e}
html.dark #gen .seg button{border:1px solid #3a3a3c;background:#2c2c2e;color:#e5e5ea}
html.dark #gen textarea{border:1px solid #3a3a3c;background:#1c1c1e;color:#f2f2f7}
html.dark #gen .dur button{background:#2c2c2e;color:#e5e5ea}
html.dark #gen .video-opts .st{border:1px solid #3a3a3c;background:#1c1c1e;color:#e5e5ea}
html.dark #gen .rtb{border:1px solid #3a3a3c;background:#1c1c1e;color:#e5e5ea}
html.dark #gen .rtb.on{background:var(--accent);color:#fff}
html.dark #gen .video-opts .refbtn{background:#2c2c2e;border:1px solid #3a3a3c;color:#e5e5ea}
html.dark #gen .video-opts #refThumbs .rt img,html.dark #gen .video-opts #refThumbs .rt video,html.dark #gen .video-opts #clipThumbs .rt video{border-color:#3a3a3c}
html.dark #gen .btns button.gray{background:#2c2c2e;color:#e5e5ea}
html.dark .medbtn{background:#2c2c2e;color:#e5e5ea}
html.dark #drawer{background:#1c1c1e}
html.dark .sess-item.on{background:#1f2a44}
html.dark .drawer-foot button{background:#2c2c2e;color:#e5e5ea}
html.dark #sessMenu{background:#1c1c1e}
html.dark #login .card{background:#1c1c1e}
html.dark #login input{border:1px solid #3a3a3c;background:#2c2c2e;color:#f2f2f7}
</style>
</head>
<body>

<header class="topbar">
  <div class="left">
    <button class="top-icon" title="会话" onclick="openDrawer()">☰</button>
    <button class="top-icon" id="newBtn" title="新建对话" onclick="newSession()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
  </div>
  <div class="top-actions">
    <button class="top-icon" id="themeBtn" title="切换主题" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<main id="main">
  <!-- 欢迎态 -->
  <section id="welcome">
    <h1 class="hello">有什么我能帮你的吗？</h1>
    <div id="quickRow" class="quick-row"></div>
  </section>

  <!-- 聊天区 -->
  <div id="chat"></div>
</main>
<button id="scrollBottom" class="sb-fab" onclick="scrollToBottom()" title="到底" aria-label="滚动到底"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>

<!-- 底部输入栏 -->
<div id="composer">
  <div id="refbar"></div>
  <div id="preview"></div>
  <div id="row">
    <button class="icon-btn" title="拍照/添加图片" onclick="fileClick()">📷</button>
    <button class="icon-btn" id="micBtn" title="语音输入" onclick="startVoice()"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:block"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg></button>
    <input type="text" id="input" placeholder="发消息或按住说话..." onkeydown="if(event.key==='Enter')send()">
    <button id="send" class="icon-btn send" onclick="send()" title="发送">➤</button>
    <button class="icon-btn plus" title="生成" onclick="toggleGen()">＋</button>
  </div>
  <input type="file" id="file" accept="image/*" multiple style="display:none">
</div>

<div class="mask" id="mask" onclick="toggleGen()"></div>
<div id="gen">
  <h3>生成</h3>
  <div class="seg">

<script>
// API 基站: 局域网优先(快速直达), 公网域名兜底; 自动探测+缓存上次可用, 保证又快又稳
const IS_WEB=(/^https?:$/.test(location.protocol)&&!/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname));
const API_CANDIDATES=IS_WEB?[location.origin]:['http://192.168.1.9:8090','https://soul0516.duckdns.org:46893'];
let API=(function(){ try{ const c=localStorage.getItem('_apiBase'); if(c&&API_CANDIDATES.indexOf(c)>=0) return c; }catch(e){} return API_CANDIDATES[API_CANDIDATES.length-1]; })();
async function _probeApi(c,tm){ try{ const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),tm); const r=await fetch(c+'/api/health',{signal:ac.signal,keepalive:true}); clearTimeout(to); return r.ok?c:null; }catch(e){ return null; } }
async function pickApiBase(){ // 缓存基站优先(上次可用最稳), 再按候选顺序(局域网先)探测
  const order=[]; try{ const c=localStorage.getItem('_apiBase'); if(c&&API_CANDIDATES.indexOf(c)>=0) order.push(c); }catch(e){}
  for(const c of API_CANDIDATES){ if(order.indexOf(c)<0) order.push(c); }
  for(const c of order){ const ok=await _probeApi(c,2500); if(ok){ API=c; try{ localStorage.setItem('_apiBase',c); }catch(e){} return c; } }
  return API;
}
window._apiReady=0;

// ---------- 诊断: 全局错误捕获/启动自检/诊断面板 (后端 /api/log /api/diag /api/logs) ----------
function reportErr(tag,msg,stack,api){ try{ fetch(API+'/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag:tag,msg:msg||'',stack:(stack||'').slice(0,800),api:api||'',device:String(navigator.userAgent).slice(0,120)})}).catch(()=>{}); }catch(e){} }
window.addEventListener('error',function(e){ reportErr('js', e.message, e.error&&e.error.stack, location.href); });
window.addEventListener('unhandledrejection',function(e){ var r=e.reason; reportErr('promise', (r&&r.message)||String(r), (r&&r.stack)||'', location.href); });
async function bootHealth(){ const base=await pickApiBase().catch(()=>API); const maxTries=3; for(let i=0;i<maxTries;i++){ const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),10000); try{ await fetch(base+'/api/health',{signal:ac.signal,keepalive:true}); clearTimeout(to); return; }catch(e){ clearTimeout(to); reportErr('health','连不上服务',e&&e.message,base+'/api/health'); if(i<maxTries-1){ await new Promise(r=>setTimeout(r,2000)); continue; } const hb=$('healthBar'); if(hb){ hb.style.display='flex'; hb.innerHTML='⚠️ 连不上服务 (API: '+esc(API)+')，点这里看诊断'; } } } }
async function openDiag(){ const d=$('diag'); if(!d) return; d.style.display='flex'; refreshDiag(); }
function closeDiag(){ const d=$('diag'); if(d) d.style.display='none'; }
async function refreshDiag(){ const b=$('diagBody'); if(!b) return; b.innerHTML='<div class="spinner"></div> 正在读取…'; let diag=null, logs=[]; try{ const rd=await fetch(API+'/api/diag',{headers:authHeaders()}); diag=await rd.json(); }catch(e){} try{ const rl=await fetch(API+'/api/logs?n=30',{headers:authHeaders()}); const jl=await rl.json(); logs=jl.logs||[]; }catch(e){} let h='<div class="row"><b>API 地址:</b> <pre>'+esc(API)+'</pre></div>'; if(diag&&diag.ok){ h+='<div class="row"><b>后端状态:</b> <pre>'+esc(JSON.stringify({version:diag.version,uptime:diag.uptime,pid:diag.pid,node:diag.node,mem:diag.mem},null,2))+'</pre></div>'; } else { h+='<div class="row"><b>后端:</b> <pre>⚠️ 连不上（或需登录）</pre></div>'; } h+='<div class="row"><b>最近错误('+logs.length+'):</b><pre>'+esc(logs.slice(-30).join('\n')||'（无）')+'</pre></div>'; b.innerHTML=h; }
function copyDiag(){ const b=$('diagBody'); if(!b) return; const txt=('【witlin 诊断】\n时间: '+new Date().toLocaleString()+'\nAPI: '+API+'\n'+b.innerText); try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast('已复制，直接发我即可')},function(){toast('复制失败')}); } else { const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('已复制'); } }catch(e){ toast('复制失败'); } }

let mode='image';let durSec=5;let imgRatio='1:1';
let videoSteps=16;let genRefs=[];let refAr=[];let genAudio=null;let genAudioName='';let genClips=[];   // 生视频: 步数 + 参考图 + 音频 + 参考视频

  const qb=t.closest('.quoteb'); if(qb){ ev.stopPropagation(); quoteImg(qb.getAttribute('data-url')); return; }
  const qt=t.closest('.qref'); if(qt){ ev.stopPropagation(); const im=qt.parentElement&&qt.parentElement.querySelector('img'); if(im){ const s=im.getAttribute('src')||''; quoteImg(s.indexOf(',')>=0?s.split(',')[1]:s); } }
});
let lastImageUrl=null;   // 最近一次生成/修改的图，作为后续上下文
let sending=false;
let curTab='chat';
let sessionToken=null;try{sessionToken=localStorage.getItem('oc_session')}catch(e){}

// ---------- 会话存储 (localStorage, 多会话) ----------
const SKEY='oc_sessions';
let sessions=[]; let curId=null; let msgSeq=0;
function loadSessions(){ try{ const a=JSON.parse(localStorage.getItem(SKEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveSess(){
  const dump=()=>JSON.stringify(sessions);
  try{ localStorage.setItem(SKEY, dump()); return; }catch(e){}
  // 配额不足: 从最旧会话开始丢弃内嵌图片, 保证会话本身能存下
  for(let si=sessions.length-1; si>=0; si--){
    const s=sessions[si]; let freed=false;
    for(const m of s.messages){ if(m.images&&m.images.length){ m.images=[]; m.hasImgs=false; freed=true; } }
    if(!freed) continue;
    try{ localStorage.setItem(SKEY, dump()); return; }catch(e){}
  }
}
function genSid(){ return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function curSession(){ return sessions.find(s=>s.id===curId)||null; }
function curMsgs(){ const s=curSession(); return s?s.messages:[]; }
function ensureSession(){
  let s=curSession();
  if(!s){ s={id:genSid(), title:'新会话', pin:false, messages:[], summary:'', createdAt:Date.now(), lastAt:Date.now()}; sessions.unshift(s); curId=s.id; saveSess(); }
  return s;
}
function autoTitle(s){
  const first=(s.messages.find(m=>m.role==='user'&&m.text)||{}).text||'';
  s.title = first?(first.length>14?first.slice(0,14)+'…':first):'新会话';
  s.lastAt=Date.now();
}
function buildHist(){
  const s=curSession(); if(!s) return [];
  const arr=s.messages.filter(m=>!m.loading && m.text).map(m=>({role:m.role, content:m.text}));
  return s.summary ? arr.slice(-6) : arr.slice(-10);
}

function $(id){return document.getElementById(id)}
function toggleTheme(){
  const dark=document.documentElement.classList.toggle('dark');
  try{ localStorage.setItem('oc_theme', dark?'dark':'light'); }catch(e){}
  const b=$('themeBtn'); if(b){ b.textContent = dark?'☀️':'🌙'; }
}
(function(){ try{ const t=localStorage.getItem('oc_theme'); if(t==='dark') document.documentElement.classList.add('dark'); const b=$('themeBtn'); if(b) b.textContent = document.documentElement.classList.contains('dark')?'☀️':'🌙'; }catch(e){} })();
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+sessionToken}}
function clearAuth(){sessionToken=null;try{localStorage.removeItem('oc_session')}catch(e){};showLogin();toast('登录已过期，请重新登录')}
async function apiFetch(url,opts={}){
  let last;
  for(let a=0;a<4;a++){
    try{
      const r=await fetch(url,opts);
      if(r.status===401&&!url.includes('/api/login'))clearAuth();
      else if(r.status>=200&&r.status<300){
        // 滑动续期: 后端在令牌临近到期时回传新令牌, 前端静默更新本地, 保证长期保持登录
        const nt=r.headers.get('X-Auth-Token');
        if(nt){ sessionToken=nt; try{localStorage.setItem('oc_session',nt)}catch(e){} }
      }
      return r;
    }catch(e){
      last=e;
      // 瞬时网络错误(断网/连接丢失/DNS/SSL 握手冷启动)才自动重试; 被 signal abort(真超时) 不重试
      const isAbort=(opts&&opts.signal&&opts.signal.aborted)||(e&&e.name==='AbortError');
      if(!isAbort) reportErr('net', String(url), e&&e.message, String(url));   // 上报瞬时网络错误(非超时)
      if(a<3&&!isAbort){ 
        // 网络错误: 刷新基站(局域网/公网漂移时自动切换), 用新基站重建 URL 再重试
        try{ const old=API; const nb=await pickApiBase(); if(nb!==old&&String(url).indexOf('http')===0){ const sp=String(url).indexOf('/',String(url).indexOf('//')+2); if(sp>0) url=API+String(url).substring(sp); } }catch(e2){}
        await new Promise(r=>setTimeout(r,(a+1)*1500)); continue; }
      throw e;
    }
  }
  throw last;
}
// 启动预热: 自动选定基站后提前建立连接(DNS/SSL/TCP), 避免首次请求因冷启动"连接失败"
function warmUpBackend(){
  try{
    if(window._warmed) return; window._warmed=true;
    pickApiBase().then(base=>{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
      fetch(base+'/api/health',{signal:ctl.signal, keepalive:true, headers:{'Accept':'application/json'}})
        .then(r=>r.json()).catch(()=>{}).finally(()=>clearTimeout(to));
    }).catch(()=>{});
  }catch(e){}
}
warmUpBackend();
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// 轻量 Markdown 渲染(先 esc 再转安全HTML, 标题/加粗/列表/代码/引用/链接)
function md(s){
  s=esc(String(s==null?'':s));
  // 保护代码块(含换行), 避免行扫描/行内转换误伤
  var blocks=[];
  s=s.replace(/```([\s\S]*?)```/g,function(m,c){blocks.push(c);return '\u0000B'+(blocks.length-1)+'\u0000'});
  // 逐行扫描分块: 段落(<div class="p">, 段内单换行转<br>) / 标题 / 引用 / 有序·无序列表 / 空行分隔
  var lines=s.split('\n'), out=[], cur=null, para=[];
  function flushPara(){ if(para.length){ out.push('<div class="p">'+para.join('<br>')+'</div>'); para=[]; } }
  function flushList(){ if(cur){ out.push(cur.type==='ul'?'<ul>':'<ol>'); out.push(cur.arr.join('')); out.push(cur.type==='ul'?'</ul>':'</ol>'); cur=null; } }
  function flushAll(){ flushPara(); flushList(); }
  for(var i=0;i<lines.length;i++){
    var ln=lines[i], um=ln.match(/^[ \t]*[-*+][ \t]+(.*)$/), om=ln.match(/^[ \t]*\d+[.)][ \t]+(.*)$/);
    var hm=ln.match(/^(#{1,6})[ \t]+(.*)$/), qm=ln.match(/^&gt;[ \t]*(.*)$/);
    if(um||om){
      flushPara();
      if(um){ if(!cur||cur.type!=='ul'){flushList();cur={type:'ul',arr:[]};} cur.arr.push('<li>'+um[1]+'</li>'); }
      else { if(!cur||cur.type!=='ol'){flushList();cur={type:'ol',arr:[]};} cur.arr.push('<li>'+om[1]+'</li>'); }
    } else if(hm){ flushAll(); out.push('<h'+hm[1].length+'>'+hm[2]+'</h'+hm[1].length+'>'); }
    else if(qm){ flushAll(); out.push('<blockquote>'+qm[1]+'</blockquote>'); }
    else if(/^\u0000B\d+\u0000$/.test(ln)){ flushAll(); out.push(ln); }   // 代码块占位符: 独立成块
    else if(!ln.trim()){ flushAll(); }   // 空行: 结束当前段落/列表
    else { para.push(ln); }
  }
  flushAll();
  s=out.join('\n');
  // 行内转换(仅剩文本与标题/列表/引用内部, 代码块占位符不受影响)
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');

async function startNativeVoice(CP){

    let perm; try{ perm = await CP.requestPermissions(); }catch(e){}

    }

    if(m){
      const bin=(m[3]||'').replace(/\s/g,''); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);

const MEDIA_CACHE = new Map();   // url -> blobObjectUrl (内存缓存, 运行期内命中)
const MEDIA_TASKS = new Map();   // url -> 在途下载 Promise (防止同一张图重复下载)

const MEDIA_CONC = 6;
let _mRun=0; const _mQ=[];
function mediaPool(fn){ return new Promise((res,rej)=>{ _mQ.push({fn,res,rej}); _mPump(); }); }
function _mPump(){ while(_mRun<MEDIA_CONC && _mQ.length){ const j=_mQ.shift(); _mRun++; j.fn().then(j.res,j.rej).finally(()=>{ _mRun--; _mPump(); }); } }

async function mediaUrl(u){

  if(MEDIA_TASKS.has(u)) return MEDIA_TASKS.get(u);   // 在途请求直接复用
  const p=(async()=>{
    // 磁盘命中: 直接转 objectURL, 不再走网络
    const disk=await idbGet(u);
    if(disk){ const bu=URL.createObjectURL(disk); mediaCacheSet(u,bu); return bu; }
    return await mediaPool(async()=>{
      const r=await fetch(API+'/api/media?url='+encodeURIComponent(u));
      if(!r.ok) throw new Error('media http '+r.status);
      const b=await r.blob();

      const bu=URL.createObjectURL(b);
      mediaCacheSet(u,bu);

    });
  })().catch(()=>null);

  n++; el.setAttribute('data-retry',n);
  el.onerror=null;
  // 流式重试: 重建代理 URL(打破锁屏后失效连接), 走后端 Range 断点续传, 不再整段 fetch
  try{ el.src=mSrc(u); el.load&&el.load(); (el.play&&el.play()).catch(function(){}); }
  catch(e){ el.onerror=()=>videoRetry(el); try{ el.onerror(); }catch(e){} }
}

// 切回前台时, 重载所有"正在播放"或"加载失败"的视频 (WKWebView 锁屏挂起会掐断媒体连接)
document.addEventListener('visibilitychange',function(){
  if(document.hidden) return;
  setTimeout(function(){
    document.querySelectorAll('video').forEach(function(v){
      const broken=v.getAttribute('data-broken');
      if(broken){ v.removeAttribute('data-broken'); v.setAttribute('data-retry','0'); videoRetry(v); }
      else if(v.error){ videoRetry(v); }
      else if(v.paused && v.getAttribute('data-mu') && (v.currentTime>0 || v.readyState>0)){ try{ v.play().catch(function(){}); }catch(e){} }
    });
    // 补拉切回前台后仍未加载/失败的媒体(走缓存, 不重复下载)
    hydrateMedia(document.getElementById('chat'));
  },600);
});

let vScale=1,vTx=0,vTy=0;
function vApply(){ const im=$('vimg'); if(im) im.style.transform='translate('+vTx+'px,'+vTy+'px) scale('+vScale+')'; const z=$('vzoomv'); if(z) z.textContent=Math.round(vScale*100)+'%'; }
function vzFit(){ vScale=1; vTx=0; vTy=0; vApply(); }
function vzTap(){ vScale=(vScale>1?1:2); if(vScale<=1){vTx=0;vTy=0;} vApply(); }
function vzAdj(d){ vScale=Math.min(8,Math.max(1,Math.round((vScale+d*0.5)*10)/10)); if(vScale<=1){vTx=0;vTy=0;} vApply(); }
(function(){ const stage=$('vstage'); if(!stage) return; let sd=0,ss=1,ps=null;
  stage.addEventListener('touchstart',function(e){
    if(e.touches.length===2){ const a=e.touches[0],b=e.touches[1]; sd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1; ss=vScale; e.preventDefault(); }
    else if(e.touches.length===1 && vScale>1){ ps={x:e.touches[0].clientX,y:e.touches[0].clientY,tx:vTx,ty:vTy}; }
  },{passive:false});
  stage.addEventListener('touchmove',function(e){
    if(e.touches.length===2){ const a=e.touches[0],b=e.touches[1]; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1; vScale=Math.min(8,Math.max(1,ss*(d/sd))); if(vScale<=1){vTx=0;vTy=0;} vApply(); e.preventDefault(); }
    else if(e.touches.length===1 && ps){ vTx=ps.tx+(e.touches[0].clientX-ps.x); vTy=ps.ty+(e.touches[0].clientY-ps.y); vApply(); e.preventDefault(); }
  },{passive:false});
  stage.addEventListener('touchend',function(e){ if(e.touches.length<2) sd=0; if(e.touches.length===0) ps=null; });
})();

function msgEl(id){ return document.querySelector('#chat .msg[data-mid="'+id+'"]'); }
function findSessionOf(m){ return sessions.find(s=>s.messages.indexOf(m)>=0)||null; }
function fillMsg(m, el, opts){
  m.loading=false;
  delete m._retryBody;   // 成功则清除失败重试缓存
  if(opts.text!==undefined) m.text=opts.text;
  m.display=opts.display||'';
  m.media=opts.media||[];
  let h=(opts.prefix||'')+(opts.display?'<div class="text">'+md(opts.display)+'</div>':'');
  if(m.media.length) h+=mediaHtml(m.media);
  if(opts.extraHtml) h+=opts.extraHtml;
  // 切会话后 el 可能已脱离 DOM, 用 data-mid 重新定位当前节点; 找不到则只更新数据
  const target=(el && el.parentNode)? el : msgEl(m.id);
  if(target && target.querySelector){ target.querySelector('.bubble').innerHTML=h; hydrateMedia(target); }
  const s=findSessionOf(m)||curSession(); if(s){ autoTitle(s); saveSess(); }
  updateNewBtn();
}
function failMsg(lm, msg){
  const m=lm.m; m.loading=false; m.text=''; m.display=msg; m.media=m.media||[];
  const target=msgEl(m.id)||lm.el;
  if(target && target.parentNode) target.querySelector('.bubble').innerHTML='<div class="text">⚠️ '+esc(msg)+'</div>';
  const s=findSessionOf(m)||curSession(); if(s){ autoTitle(s); saveSess(); }
  updateNewBtn();
}
// 失败并带"点击重试"按钮: 复用原请求 body 重新提交
function failMsgRetry(lm, msg, body){
  const m=lm.m; m.loading=false; m.text=''; m.display=msg; m.media=m.media||[]; m._retryBody=body;
  const target=msgEl(m.id)||lm.el;
  if(target && target.parentNode){
    target.querySelector('.bubble').innerHTML='<div class="text">⚠️ '+esc(msg)+'</div>'
      +'<div class="retry-row"><button class="medbtn retryb" type="button" onclick="retryMsg('+m.id+')">🔄 点击重试</button></div>';
  }
  const s=findSessionOf(m)||curSession(); if(s){ autoTitle(s); saveSess(); }
  updateNewBtn();
}
function findMsg(id){ for(const s of sessions){ const m=s.messages.find(x=>x.id===id); if(m) return {s,m}; } return null; }
function retryMsg(id){
  const f=findMsg(id); if(!f || !f.m._retryBody){ toast('没有可重试的内容'); return; }
  const lm={s:f.s, m:f.m, el:msgEl(id)};
  doSend(lm, f.m._retryBody);
}

// 前端本地"是否需联网"判断(L0): 返回 'yes'/'no'/'null'
// 与后端 needWebSearch 判定对齐, 但零 LLM 延迟。
// 原则: 明确实时/最新/价格/需验证 -> 'yes'; 明确常识/代码/创意/闲聊/翻译 -> 'no';
//       其余(含"什么/怎么/为什么/多少"但无明确实时词) -> null, 交后端 LLM 兜底, 避免本地误判漏搜。
function localSearchHint(msg){
  msg=(msg||'').trim(); if(!msg) return null;
  // 强 "需搜" 信号: 实时/动态/最新/价格/权威/需验证
  const yes = /天气|气温|温度|预报|降雨|下雨|下雪|台风|雾|晴|阴|风力|气温|新闻|快讯|汇率|美元|日元|欧元|英镑|港元|澳元|加元|股价|涨停|跌停|涨了|跌了|基金|赛果|比分|排片|航班|车次|油价|黄金|金价|股票|股市|大盘|上证|深证|A股|港股|美股|最新|最近|近日|发布|上市|新规|政策|法规|分数线|中高考|录取|报价|多少钱|价格|销量|口碑|评分|测评|参数|配置|评测|实测|哪家更好|哪个更|值不值得|真的有吗|怎么回事|区别|对比|哪个好|排名|榜单|最新开源|github|hugging|huggingface|api|报错|error|bug|开源模型|招聘|投标|招标|上市|中签/i.test(msg);
  if(yes) return 'yes';
  // 明确 "不用搜" 且自包含(无需外部信息): 代码/数学/翻译/纯创作
  if(/^(用|写|如何|怎么).*(python|javascript|js|java|go|rust|c\+\+|html|css|代码|函数|算法|正则|sql|脚本|程序|回文|排序|爬虫|斐波那契|递归|链表|二叉树|接口|对象|类)/i.test(msg)) return 'no'; // 代码题
  if(/^\s*[\d\s+\-*/().^=]+\??\s*$/i.test(msg) || /^(算|求|解|1\+|2\+|3\+)[\d\s+\-*/()=]*=?/i.test(msg)) return 'no'; // 纯数学
  if(/翻译|帮我翻译|把.*(翻|译)成|用英语说|用日语说|用粤语说/i.test(msg)) return 'no'; // 翻译
  if(/^(写|创作|写一|编|帮我写|帮我(写|做|生成|画)).*(诗|歌|散文|故事|文案|文章|祝福|情书|朋友圈|标题|口号|致辞|报告|感谢信)/i.test(msg)) return 'no'; // 纯创作
  if(/^(你好|hi|hello|您好|早上好|晚上好|晚安|谢谢|感谢|再见|哈哈|哈哈|嗯|哦|好|行|厉害|太棒|你叫|你是谁|你是谁呀|在吗|拜拜)/i.test(msg)) return 'no'; // 问候/闲聊
  // 一般知识/概念解释: 含疑问词时拿不准 -> 交后端兜底(避免误判漏搜); 不含疑问词且确定是"解释/介绍"才 no
  if(/^(什么是|解释一下|解释|介绍下|介绍一下|讲讲|说说|描述)/i.test(msg)){
    if(!/(什么|怎么|为什么|哪|多少|区别|对比|最新|最近|今天|现在|价格|多少钱|涨|跌|新闻)/i.test(msg)) return 'no';
    return null;
  }
  return null;
}
// 前端规则意图识别(快, 零延迟): 命中就返回,intent 可选 chat/image/video/edit/erase/web/location
function ruleIntent(msg, hasImg){
  msg=msg||'';
  if(/天气|气温|温度|预报|降雨|下雨|下雪|台风|雾|晴|阴|风力|风|新闻|汇率|美元|日元|欧元|股价|涨停|跌|基金|赛果|比分|几点|时间|多少钱|油价|学费|房价|股票/i.test(msg)) return {intent:'web'};
  if(/附近|周边|离我|导航|定位|怎么去|去哪儿|在哪|坐标/.test(msg)) return {intent:'location'};
  if(/画一个|画个|画只|画张|画幅|帮我画|给我画|生成.*(图|图片|画)|配个图|做个图|生成一张|画一|绘制|画一只|画一个/.test(msg)) return {intent:'image'};
  if(/视频|动图|动画|短片|生成.*(视频|动画|短片)|做个.*(视频|动画)|一段视频/.test(msg)) return {intent:'video'};
  if(hasImg && /去掉|移除|擦除|消除|抹掉|清除|删掉|拿掉|擦掉|祛除|去除|不要.*耳机|擦.*水印|去掉.*耳机|摘.*耳机|去掉|擦除|移除/.test(msg)) return {intent:'erase'};
  if(hasImg && /换成|改成|染成|染|涂|变身|变成|穿上|西装|衣服|发型|发色|换成.*|改成.*色|变.*真人/.test(msg)) return {intent:'edit'};
  return null;
}

// ---------- 上下文压缩 ----------
async function compressContext(s, silent){
  s=s||curSession(); if(!s) return;
  const msgs=s.messages.filter(m=>!m.loading&&m.text).map(m=>({role:m.role,content:m.text}));
  if(!msgs.length){ if(!silent) toast('当前没有可压缩的内容'); return; }
  if(msgs.length<12 && !silent){ toast('对话还不长，暂无需压缩'); return; }
  if(!silent) toast('正在压缩上下文…');
  try{
    const r=await apiFetch(API+'/api/summarize',{method:'POST',headers:authHeaders(),body:JSON.stringify({messages:msgs.slice(0,60)})});
    const j=await r.json();
    if(j.ok&&j.summary){ s.summary=j.summary; saveSess(); if(!silent) toast('已压缩上下文(旧内容转为摘要)'); renderSessionList(); }
    else throw new Error(j.error?j.error.message:'压缩失败');
  }catch(e){ if(!silent) toast('压缩失败：'+(e.message||'')); }
}
function compressCurrent(){ compressContext(curSession(), false); }

async function send(){
  const txt=$('input').value.trim();
  if(sending)return;
  if(!txt&&pendingImages.length===0&&!refImg)return;
  showChat();
  const imgs=pendingImages.slice();
  const msgImgs=imgs.slice(); const msgMedia=[];
  if(refImg){ if(/^https?:/.test(refImg)) msgMedia.push({type:'image',url:refImg}); else msgImgs.push(refImg); }
  commitMsg('user', txt, msgImgs, msgMedia);   // 引用的图也显示在消息里, 像上传图一样
  $('input').value='';pendingImages=[];renderPreview();
  sending=true;$('send')&&($('send').disabled=true);
  const lm=loadingMsg();
  let histArr=buildHist().slice(0,-1);   // 去掉刚写入的当前用户消息, 避免上下文重复
  const hasNewImgs=imgs.length>0;
  // 本地认知：判断是否新话题… 这里不再用本地语义模型(transformers/cog)阻塞主线程，避免"点发送卡一下"。仅新传图时压缩到最近一轮，其余交给后端构建历史+摘要兜底。
  try{
    if(hasNewImgs) histArr=histArr.slice(-2);   // 新上传图片=新视觉查询，只带最近一轮
  }catch(e){}
  const body={message:txt, history:histArr};
  // 按需自动定位: 仅当消息与位置相关(查天气/附近等)才定位并带上, 其余不定位
  if(needLocation(txt)){
    const loc = userLoc || await locateMe();
    if(loc) body.location = loc;
  }
  const s=curSession(); if(s && s.summary) body._compressContext=s.summary;
  // 意图先算(前端规则): hasImage 表示本会话内有图可用(含上一张), 用于擦除/改图等规则识别
  let intentObj = ruleIntent(txt, !!(imgs.length||lastImageUrl||refImg));
  let chatImgs = imgs.map(b=>({data:b,mime:'image/jpeg'}));
  if(refImg){ chatImgs.unshift(/^https?:/.test(refImg)?{url:refImg}:{data:refImg,mime:'image/jpeg'}); }  // 引用的图片作为改图对象
  // 是否回带上上一张图: 仅当本次确实与图相关(改/擦/换/生成/图问答)才注入;
  // 纯文本问答/联网搜索(例: 生成一张图后再问"最新电影")不注入, 避免把普通问题拖成慢速视觉任务、模型误判去生图
  const imgRel = !!lastImageUrl && (
    (intentObj && /edit|erase|image|styl/.test(intentObj.intent||''))
    || /改|换|擦|去掉|移除|染|删掉|变成|变装|加字|加文字|参考.*(图|这张)|根据.*(图|这张)|刚才那张|上一张|这张图|这个图|那张图|那个图|图里|图上有|图中有|图里的|画面里|把(它|这个|那)|将(它|这个|那)|(帮我|请帮我).(改|修|换|去|擦)/.test(txt)
  );
  if(chatImgs.length===0 && imgRel){ chatImgs=[{url:lastImageUrl}]; }   // 图相关才带上上一张图做上下文
  if(chatImgs.length)body.images=chatImgs;
  // 抓不住且涉及图/画/改/换等再调后端一次识别
  if(!intentObj && (chatImgs.length>0 || imgRel || /图|画|改|换|去|染|生成|视频|衣|发|水印|手表|耳机/.test(txt))){
    try{
      const ir=await apiFetch(API+'/api/intent',{method:'POST',headers:authHeaders(),body:JSON.stringify({message:txt, has_image:!!(chatImgs.length>0||imgRel)})});
      const ij=await ir.json(); if(ij&&ij.ok&&ij.intent) intentObj=ij.intent;
    }catch(e){ /* 意图识别失败不影响主流程 */ }
  }
  if(intentObj) body._intent=intentObj;
  // 本地联网判断(L0): 明确 web 意图或命中实时词 -> 直接标记要搜; 否则用本地规则判断, 命中即传给后端跳过 LLM 判断(更快)
  if(intentObj && intentObj.intent==='web'){ body._searchHint='yes'; }
  else { const _sh=localSearchHint(txt); if(_sh) body._searchHint=_sh; }
  await doSend(lm, body);
}
// 发送/生图请求执行入口: 可被失败重试复用; 失败弹"点击重试"按钮
async function doSend(lm, body){
  sending=true;if($('send'))$('send').disabled=true;
  if(lm.m) lm.m.loading=true;
  const tEl=msgEl(lm.m.id)||lm.el;
  if(tEl && tEl.querySelector) tEl.querySelector('.bubble').innerHTML='<span class="spinner"></span> 思考中…';
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),300000); // 生成多图/agentic/联网搜索耗时长, 对齐后端 5 分钟, 避免"想久一点就失败"
  // 纯文字对话→流式实时逐字输出; 图片/生图/视频/编辑→保持非流式(后台任务模式)
  const _intent=(body&&body._intent&&body._intent.intent)||'';
  const _genIntent=/image|video|edit|erase/.test(_intent);
  const _noImg=!(body.images&&body.images.length);
  const _genWord=/画|海报|视频|写真|换脸|水印|抠图|修图|改图|头像|壁纸|做张|来张/.test((body.message||''));
  if(_noImg && !_genIntent && !_genWord){
    try{ await streamSend(lm, body, ac); }
    finally{ clearTimeout(to); }
    sending=false;if($('send'))$('send').disabled=false;scrollBottom();
    return;
  }
  try{
    const r=await apiFetch(API+'/api/chat',{method:'POST',headers:authHeaders(),body:JSON.stringify(body),signal:ac.signal});
    const j=await r.json();
    if(!j.ok) throw new Error((j.error&&(j.error.message||j.error.detail))||'请求失败，请重试');   // 后端报错不再空泡泡
    let media=[];
    const prefix=j.searched?'<div style="font-size:12px;color:var(--accent);margin-bottom:6px">🌐 已联网搜索</div>':'';
    if(j.task_id){
      // 生图为长耗时任务: 锁屏/切后台后任务在服务端继续, 回来轮询取结果, 避免"Load failed"
      fillMsg(lm.m, lm.el, {text:j.reply||'', display:j.reply||'', media:[], prefix});
      media=await pollTask(j);   // 轮询直到 done 或超时; 失败抛出由外层处理
    } else {
      if(j.media&&j.media.length)media=j.media;
    }
    fillMsg(lm.m, lm.el, {text:j.reply||'', display:j.reply||'', media, prefix});
    if(media.length){ const _im=media.find(x=>x.type==='image'); if(_im&&_im.url) lastImageUrl=_im.url; }   // chat出图也更新最近图, 便于接着改
    speak(j.reply||'');
    clearRef();
    const ss=curSession();
    if(ss && ss.messages.filter(m=>!m.loading&&m.text).length>24) compressContext(ss,true);
  }catch(e){ failMsgRetry(lm, ac.signal.aborted?'响应太慢（可能联网搜索中），请稍后重试':((e&&e.message)||String(e)), body); }
  finally{clearTimeout(to)}
  sending=false;if($('send'))$('send').disabled=false;scrollBottom();
}
// 流式发送: SSE 逐字渲染(纯文字对话); 生图/视频走原非流式(后台任务)
async function streamSend(lm, body, ac){
  const tEl=msgEl(lm.m.id)||lm.el;
  const bubble=tEl && tEl.querySelector ? tEl.querySelector('.bubble') : null;
  if(bubble){ bubble.innerHTML=''; }
  const textEl=document.createElement('div'); textEl.className='text';
  if(bubble) bubble.appendChild(textEl);
  let prefix=false, acc='', statusEl=null, persistAt=0;
  // XHR 渐进式流读取: iOS WKWebView 对 fetch(ReadableStream) 的增量解析不可靠(常整段缓冲或挂起, 表现为"一直思考中"),
  // 改用 XHR onprogress 逐段读 responseText, 是 WKWebView 下最可靠的"逐字输出"方式
  return new Promise((resolve)=>{
    let settled=false;
    const done=(errMsg)=>{
      if(settled) return; settled=true;
      lm.m.text=acc; lm.m.display=acc; if(lm.m) lm.m.loading=false;
      if(lm.el && lm.el.classList) lm.el.classList.remove('loading');
      // 关键: 完成后立即持久化(loadingMsg 曾把 loading+空 写入 localStorage, 原代码结束后没保存, 重开会读到"loading+空"一直转圈)
      const _s=findSessionOf(lm.m)||curSession(); if(_s){ autoTitle(_s); saveSess(); }
      if(errMsg){
        if(!acc) failMsgRetry(lm, errMsg, body); else scrollBottom();
      } else {
        speak(acc);
        clearRef();
        const ss=curSession();
        if(ss && ss.messages.filter(m=>!m.loading&&m.text).length>24) compressContext(ss,true);
      }
      resolve();
    };
    let xhr=null;
    try{
      xhr=new XMLHttpRequest();
      let buf='', consumed=0;
      const feed=(full)=>{
        const seg=full.slice(consumed); consumed=full.length; buf+=seg;
        let idx, stop=false;
        while((idx=buf.indexOf('\n'))>=0){
          const line=buf.slice(0,idx).trim(); buf=buf.slice(idx+1);
          if(!line.startsWith('data:')) continue;
          const data=line.slice(5).trim();
          if(data==='[DONE]'){ stop=true; break; }
          let ch; try{ ch=JSON.parse(data); }catch(e){ continue; }
          // 阶段进度(后端提前发): 联网搜索/意图识别期间给用户即时反馈, 避免长时间"思考中"像卡死
          if(ch.meta && (ch.meta.stage || ch.meta.searched)){
            if(!statusEl && bubble){ statusEl=document.createElement('div'); statusEl.style.cssText='font-size:12px;color:var(--accent);margin-bottom:6px'; bubble.insertBefore(statusEl,bubble.firstChild); }
            if(statusEl){
              if(ch.meta.searched){ statusEl.textContent='🌐 已联网搜索'; prefix=true; }
              else if(ch.meta.stage==='searching'){ statusEl.textContent='🌐 正在联网搜索…'; }
              else if(ch.meta.stage==='intent'){ statusEl.textContent='⏳ 正在分析意图…'; }
              else if(ch.meta.stage==='thinking'){ statusEl.textContent='⏳ 思考中…'; }
              else { statusEl.textContent='⏳ '+(ch.meta.stage||'处理中')+'…'; }
            }
          }
          if(ch.t){ acc+=ch.t; if(textEl){ textEl.innerHTML=md(acc); scrollBottom(); } }
        }
        // 增量持久化: 把已收到的内容实时写回; 防止 App 被杀/中断时最后一条停留在 loading+空(重开后一直转圈)
        lm.m.text=acc; lm.m.display=acc;
        const _now=Date.now();
        if(!persistAt || _now-persistAt>800){ persistAt=_now; const _s=findSessionOf(lm.m)||curSession(); if(_s){ saveSess(); } }
        if(stop) buf='';
      };
      xhr.open('POST', API+'/api/chat', true);
      xhr.setRequestHeader('Content-Type','application/json');
      xhr.setRequestHeader('Authorization','Bearer '+sessionToken);
      xhr.responseType='text';
      xhr.timeout=300000;
      if(ac && ac.signal) ac.signal.addEventListener('abort', ()=>{ try{ xhr.abort(); }catch(e){} });
      xhr.onprogress=()=>{ try{ if(xhr.readyState>=3 && xhr.responseText) feed(xhr.responseText); }catch(e){} };
      xhr.onload=()=>{ try{ if(xhr.responseText) feed(xhr.responseText); }catch(e){} done(null); };
      xhr.onerror=()=>{ done((ac&&ac.signal&&ac.signal.aborted)?'响应太慢（可能联网搜索中），请稍后重试':'网络连接失败'); };
      xhr.ontimeout=()=>{ done('响应太慢（可能联网搜索中），请稍后重试'); };
      xhr.onabort=()=>{ done((ac&&ac.signal&&ac.signal.aborted)?'响应太慢（可能联网搜索中），请稍后重试':'请求被取消'); };
      xhr.send(JSON.stringify({...body, stream:true}));
    }catch(e){ done('请求失败：'+((e&&e.message)||String(e))); }
  });
}
// 生图任务轮询: 独立短请求逐个拉取, 锁屏/切后台恢复后能继续, 不会因单次长请求被杀而丢结果
async function pollTask(j){
  const t0=Date.now();
  for(;;){
    let st=null;
    try{
      const r=await apiFetch(API+'/api/task/'+j.task_id,{headers:authHeaders()});
      st=await r.json();
    }catch(e){ st=null; }   // 网络瞬时错误/被挂起: 忽略, 下一轮再试
    if(st && st.ok && st.status==='done') return st.media||[];
    if(st && st.ok && st.status==='failed') throw new Error(st.err||'生成失败');
    if(Date.now()-t0 > 600000) throw new Error('生成超时，请稍后重试');   // 10 分钟上限
    await new Promise(r2=>setTimeout(r2,3000));
  }
}

async function shrinkImage(dataUrl,maxDim,q){return new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const m=Math.max(w,h);if(m>maxDim){const s=maxDim/m;w=w*s;h=h*s;}w=Math.max(64,Math.min(maxDim,Math.floor(w/64)*64));h=Math.max(64,Math.min(maxDim,Math.floor(h/64)*64));try{const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',q).split(',')[1]);}catch(err){res(dataUrl.split(',')[1]);}};img.onerror=()=>res(dataUrl.split(',')[1]);img.src=dataUrl;});}

function imgDims(dataUrl){

    if(typeof dataUrl!=='string'||dataUrl.indexOf('data:')!==0){ res(null); return; }
    const im=new Image();
    im.onload=()=>{ const w=im.naturalWidth,h=im.naturalHeight; res((w&&h)?{w,h}:null); };

  });

// 图片宽高比 -> H3 支持比例预设 (与后端一致), 返回可用于 /api/video 的 width/height
function refVideoWH(w,h){
  if(!w||!h) return null;
  const R=[{key:'21:9',r:21/9,w:1792,h:768},{key:'16:9',r:16/9,w:1344,h:768},{key:'4:3',r:4/3,w:1024,h:768},{key:'1:1',r:1,w:768,h:768},{key:'3:4',r:3/4,w:768,h:1024},{key:'9:16',r:9/16,w:768,h:1344}];
  const ar=w/h; let best=R[0],bd=1e9;
  for(const x of R){ const d=Math.abs(x.r-ar); if(d<bd){ bd=d; best=x; } }
  return {width:best.w,height:best.h,ratio:best.key};
}
// 把参考图 cover 等比缩放+居中裁剪到目标尺寸(tw x th), 输出 jpeg dataURL
// 目的: 交给生视频模型的参考图就是精确目标比例, 输出无拉伸、无黑边
function coverToRatio(dataUrl, tw, th){
  return new Promise(res=>{
    if(typeof dataUrl!=='string'||dataUrl.indexOf('data:')!==0){ res(dataUrl); return; }
    const im=new Image();
    im.onload=()=>{
      const iw=im.naturalWidth, ih=im.naturalHeight;
      if(!iw||!ih){ res(dataUrl); return; }
      try{
        const cv=document.createElement('canvas'); cv.width=tw; cv.height=th;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#000'; ctx.fillRect(0,0,tw,th);
        const scale=Math.max(tw/iw, th/ih);      // cover: 取较大缩放, 填满目标框
        const sw=tw/scale, sh=th/scale;          // 从原图裁出的源区域
        const sx=(iw-sw)/2, sy=(ih-sh)/2;        // 居中裁剪
        ctx.drawImage(im, sx, sy, sw, sh, 0, 0, tw, th);
        res(cv.toDataURL('image/jpeg', 0.92));
      }catch(e){ res(dataUrl); }
    };
    im.onerror=()=>res(dataUrl);
    im.src=dataUrl;
  });
}
async function doGen(){
  const prompt=$('prompt').value.trim();if(!prompt){toast('请输入提示词');return}
  toggleGen();showChat();
  $('prompt').value='';
  const lm=loadingMsg('');
  try{
    if(mode==='image'){
      const imgWH=ratioWH(imgRatio);
      const r=await apiFetch(API+'/api/image',{method:'POST',headers:authHeaders(),body:JSON.stringify({prompt,width:imgWH.w,height:imgWH.h})});
      const j=await r.json();if(!j.ok||!j.image_url)throw new Error(j.error?j.error.message:'生图失败');
      lastImageUrl=j.image_url;
      fillMsg(lm.m, lm.el, {display:'已生成', media:[{type:'image',url:j.image_url}]});
    }else{
      const body={prompt,duration:durSec,steps:videoSteps};
      if(genRefs.length){
        let targetW=null, targetH=null;
        // 按参考图比例对齐输出分辨率 + cover 等比缩放裁剪参考图, 输出无拉伸无黑边
        try{
          const dims=await imgDims(genRefs[0]);
          if(dims && dims.w && dims.h){
            const wh=refVideoWH(dims.w, dims.h);
            if(wh){ targetW=wh.width; targetH=wh.height; }
          }
        }catch(e){}
        // cover 每张参考图到目标比例(精确), 模型收到的是标准比例图, 不会被硬拉
        body.images=[];
        for(const ref of genRefs){
          if(targetW && targetH){ body.images.push(await coverToRatio(ref, targetW, targetH)); }
          else { body.images.push(ref); }
        }
        if(targetW && targetH){ body.width=targetW; body.height=targetH; }
      }
      if(genClips.length) body.video_clips=[...genClips];
      if(genAudio) body.audio=genAudio;
      const r=await apiFetch(API+'/api/video',{method:'POST',headers:authHeaders(),body:JSON.stringify(body)});
      const j=await r.json();if(!j.ok||!j.task_id)throw new Error(j.error?j.error.message:'视频提交失败');
      const tid=j.task_id;let t=0;
      for(;;){t++;
        const s=await apiFetch(API+'/api/video/'+tid,{headers:authHeaders()});
        const st=await s.json();
        const cur=msgEl(lm.m.id)||lm.el;   // 每次按 id 重新定位, 支持切会话
        if(cur && cur.parentNode) cur.querySelector('.bubble').innerHTML='<div class="progress">生成中… '+(st.status||'')+' '+t+'s</div>';
        if(st.status==='done'&&st.video_url){ fillMsg(lm.m, cur, {display:'', media:[{type:'video',url:st.video_url}]}); break; }
        if(st.status==='failed'){ failMsg(lm,'生成失败'); break; }
        if(t>180){ failMsg(lm,'生成超时'); break; }
        await new Promise(r=>setTimeout(r,3000));
      }
    }
  }catch(e){ failMsg(lm, e.message); }
  scrollBottom();
}

// ---------- 涂抹擦除 (mask + remove LoRA, 按接入指南 7.1) ----------
// 移除类：用户涂抹标记要擦掉的物体 -> 生成 mask(白=涂) -> /api/edit 带 use_lora:'remove' + edit_strength:1.0，
// mask 外用原图像素直接贴回，所以"只擦目标、其余完全不变"。与"改图"(指令式微调)分开两条链路。
let erUrl='', erStrokes=[], erDrawing=false, erLast=null, erBrushLw=0;
function erSetBrush(v){
  erBrushLw=parseInt(v)||40;
  const bv=$('erBrushV'); if(bv) bv.textContent=erBrushLw;
  erRedraw();
}
function erasePrompt(url){
  erUrl=url; erStrokes=[];
  const ov=$('eraseOv'); ov.classList.add('on');
  const img=$('erImg'); img.src=mSrc(url);
  img.onload=()=>{ erLayout(); erRedraw(); };
}
function erLayout(){
  const img=$('erImg'), show=$('erShow'), maskc=$('erMask'), stage=$('erStage');
  const ir=img.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  const w=Math.max(1,Math.round(ir.width)), h=Math.max(1,Math.round(ir.height));
  show.width=w; show.height=h; maskc.width=w; maskc.height=h;
  show.style.left=(ir.left-sr.left)+'px'; show.style.top=(ir.top-sr.top)+'px';
  // 画笔大小按图宽自适应，滑块可调
  const br=$('erBrush');
  if(br){
    br.min=Math.max(4, Math.round(w*0.01));
    br.max=Math.max(40, Math.round(w*0.2));
    erBrushLw=Math.max(20, Math.round(w*0.05));
    br.value=erBrushLw;
    const bv=$('erBrushV'); if(bv) bv.textContent=erBrushLw;
  }
}
function erPos(e){
  const c=$('erShow').getBoundingClientRect();
  const cx=(e.touches&&e.touches[0])?e.touches[0].clientX:(e.clientX||0);
  const cy=(e.touches&&e.touches[0])?e.touches[0].clientY:(e.clientY||0);
  return {x:cx-c.left, y:cy-c.top};
}
function erDown(e){ if(!erUrl)return; e.preventDefault(); erDrawing=true; erLast=null; erBegin(erPos(e)); }
function erMove(e){ if(!erDrawing)return; e.preventDefault(); var pt=erPos(e); if(erLast) erLast.push(pt); erRedraw(); }
function erUp(){ erDrawing=false; erLast=null; }
function erBegin(pt){ erStrokes.push([pt]); erLast=erStrokes[erStrokes.length-1]; erRedraw(); }
function erRedraw(){
  const show=$('erShow'), maskc=$('erMask');
  if(!show.width||!show.height) return;
  const sctx=show.getContext('2d'), mctx=maskc.getContext('2d');
  sctx.clearRect(0,0,show.width,show.height); mctx.clearRect(0,0,maskc.width,maskc.height);
  const lw=erBrushLw || Math.max(20, Math.round(show.width*0.05));  // 笔刷按图宽自适应，可滑块调
  sctx.lineCap='round'; sctx.lineJoin='round'; sctx.lineWidth=lw; sctx.strokeStyle='rgba(255,60,60,0.5)';
  mctx.lineCap='round'; mctx.lineJoin='round'; mctx.lineWidth=lw; mctx.strokeStyle='#fff';
  erStrokes.forEach(st=>{ if(!st.length)return; sctx.beginPath(); mctx.beginPath();
    st.forEach((p,i)=>{ if(i===0){ sctx.moveTo(p.x,p.y); mctx.moveTo(p.x,p.y);} else { sctx.lineTo(p.x,p.y); mctx.lineTo(p.x,p.y);} });
    sctx.stroke(); mctx.stroke(); });
}
function erUndo(){ erStrokes.pop(); erRedraw(); }
function erClear(){ erStrokes=[]; erRedraw(); }
function eraseCancel(){ const ov=$('eraseOv'); ov.classList.remove('on'); erStrokes=[]; erDrawing=false; }
function eraseFinish(){
  const maskc=$('erMask');
  const px=maskc.getContext('2d').getImageData(0,0,maskc.width,maskc.height).data;
  let any=false; for(var i=3;i<px.length;i+=4){ if(px[i]>40){ any=true; break; } }
  if(!any){ toast('请先涂抹要擦除的区域'); return; }
  const maskB64=maskc.toDataURL('image/png').split(',')[1];
  const p=prompt('大致涂抹即可。要如何处理涂抹区域？可去掉或替换。例如：去掉耳机 / 换成性感衣服');
  const obj=(p||'').trim();
  if(!obj){ eraseCancel(); return; }
  const url=erUrl; eraseCancel();
  eraseImage(url, obj, maskB64);
}
async function eraseImage(imgUrl,obj,maskB64){
  const lm=loadingMsg('');
  try{
    const r=await apiFetch(API+'/api/edit',{method:'POST',headers:authHeaders(),body:JSON.stringify({prompt:obj,image_url:imgUrl,mask_base64:maskB64,edit_strength:1.0})});
    const j=await r.json();if(!j.ok||!j.image_url)throw new Error(j.error?j.error.message:'擦除失败');
    lastImageUrl=j.image_url;
    fillMsg(lm.m, lm.el, {display:'已擦除', media:[{type:'image',url:j.image_url}]});
  }catch(e){ failMsg(lm, e.message); }
  scrollBottom();
}

(function(){ const st=$('erStage'); if(!st)return;
  st.addEventListener('touchstart',erDown,{passive:false});
  st.addEventListener('touchmove',erMove,{passive:false});
  st.addEventListener('touchend',erUp);
  st.addEventListener('mousedown',erDown);
  st.addEventListener('mousemove',erMove);
  st.addEventListener('mouseup',erUp);
  st.addEventListener('mouseleave',erUp);
})();

async function doSearch(){
  const q=prompt('要联网搜索什么？例如：今天佛山天气 / 黄金价格');
  if(!q||!q.trim())return;
  showChat();
  const lm=loadingMsg('搜索中…');
  // 带已缓存定位(油价/天气/价格类更贴近本地), 无缓存则不阻塞
  const payload={query:q.trim()};
  try{
    if(userLoc && userLoc.label){ payload.location={label:userLoc.label, lat:userLoc.lat, lng:userLoc.lng}; }
    else if(needLocation(q)){ const _loc=await locateMe(); if(_loc&&_loc.label) payload.location={label:_loc.label, lat:_loc.lat, lng:_loc.lng}; }
  }catch(e){}
  try{
    const r=await apiFetch(API+'/api/search',{method:'POST',headers:authHeaders(),body:JSON.stringify(payload)});
    const j=await r.json();if(!j.ok)throw new Error(j.error?j.error.message:'搜索失败');
    const parts=[];
    const txt=(j.answer||'').trim()||'（未找到相关内容）';
    parts.push('<div class="text">'+md(txt)+'</div>');
    if(Array.isArray(j.sources)&&j.sources.length){
      parts.push('<div class="text" style="margin-top:10px;opacity:.65;font-size:12px;line-height:1.7">来源：<br>'+j.sources.map(s=>'• '+esc(s)).join('<br>')+'</div>');
    }
    lm.m.text=txt; lm.m.display=txt; lm.m.loading=false;
    lm.el.querySelector('.bubble').innerHTML=parts.join('');
    const ss=curSession(); if(ss){ autoTitle(ss); saveSess(); }
  }catch(e){ lm.el.querySelector('.bubble').innerHTML='<div class="text">⚠️ '+esc(e.message)+'</div>'; const ss=curSession(); if(ss) saveSess(); }
  scrollBottom();
}
