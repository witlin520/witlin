name: build-ios-ipa
on:
  push:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15          # macOS 15 稳定镜像(macos-14 已退役)
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --omit=optional

      - name: 准备端侧模型与运行时
        run: |
          set -e
          mkdir -p www/ort www/models/Xenova/bge-small-zh-v1.5/onnx
          cp node_modules/@xenova/transformers/dist/transformers.min.js www/
          cp node_modules/@xenova/transformers/dist/ort-wasm-simd.wasm www/ort/
          cp node_modules/@xenova/transformers/dist/ort-wasm.wasm www/ort/
          B=https://huggingface.co/Xenova/bge-small-zh-v1.5/resolve/main
          curl -L --fail -o www/models/Xenova/bge-small-zh-v1.5/onnx/model_quantized.onnx "$B/onnx/model_quantized.onnx"
          curl -L --fail -o www/models/Xenova/bge-small-zh-v1.5/tokenizer.json "$B/tokenizer.json"
          curl -L --fail -o www/models/Xenova/bge-small-zh-v1.5/tokenizer_config.json "$B/tokenizer_config.json"
          curl -L --fail -o www/models/Xenova/bge-small-zh-v1.5/config.json "$B/config.json"
          test "$(stat -f%z www/models/Xenova/bge-small-zh-v1.5/onnx/model_quantized.onnx)" -gt 20000000
          echo "模型与运行时就绪，www 大小:"; du -sh www

      - name: 生成 iOS 工程
        run: npx cap add ios

      - name: 同步原生插件、web 资源与 Pods
        run: npx cap sync ios

      - name: 注入 iOS 权限描述(麦克风/语音识别)
        run: |
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 语音输入需要麦克风权限" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 语音识别需要语音权限" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 拍照需要使用相机" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 选择图片需要访问相册" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryAddUsageDescription" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 保存图片需要访问相册" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion zh_CN" ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string zh_CN" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string zh-Hans" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string en" ios/App/App/Info.plist

      - name: 构建 unsigned App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath "$GITHUB_WORKSPACE/build/App.xcarchive" \
                     -allowProvisioningUpdates \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: 打包成 unsigned ipa
        run: |
          mkdir -p Payload
          cp -R "$GITHUB_WORKSPACE/build/App.xcarchive/Products/Applications/"*.app Payload/
          zip -r -X App-unsigned.ipa Payload/App.app

      - name: 上传 ipa 产物
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned-ipa
          path: App-unsigned.ipa
