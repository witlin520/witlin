name: build-ios-ipa
on:
  push:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14          # 免费 macOS 构建机
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 生成 iOS 工程
        run: npx cap add ios

      - name: 同步原生插件与 Pods
        run: npx cap sync ios

      - name: 注入 iOS 权限描述(麦克风/语音识别)
        run: |
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 语音输入需要麦克风权限" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 语音识别需要语音权限" ios/App/App/Info.plist

      - name: 构建 unsigned App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath "$GITHUB_WORKSPACE/build/App.xcarchive" \
                     -allowProvisioningUpdates \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: 打包成 unsigned ipa
        run: |
          mkdir -p Payload
          cp -R "$GITHUB_WORKSPACE/build/App.xcarchive/Products/Applications/"*.app Payload/
          zip -r -X App-unsigned.ipa Payload/App.app

      - name: 上传 ipa 产物
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned-ipa
          path: App-unsigned.ipa
